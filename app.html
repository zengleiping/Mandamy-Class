<html lang="zh-Hant">
<head>

<title>曼米中文平台</title>
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap">
<style>
  :root{ --paper:#FAF7F2; --surface:#fff; --surface-2:#F2EAE0; --ink:#2B2320; --ink-soft:#6B5F55; --line:rgba(43,35,32,.12); --seal:#E8825A; --seal-soft:#FBE8DE; --bamboo:#4C8577; --bamboo-soft:#E3F0EC; --shadow:0 8px 24px -10px rgba(28,33,30,.18); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  #root{ height:100%; }
  a.btn{ text-decoration:none; color:var(--ink); display:inline-block; }
  body{ background:var(--paper); color:var(--ink); font-family:"Plus Jakarta Sans","Noto Sans TC",-apple-system,sans-serif; -webkit-tap-highlight-color:transparent; }
  h1,h2,h3{ font-family:"LXGW WenKai TC","Noto Serif TC",serif; margin:0; }
  button{ font:inherit; color:inherit; cursor:pointer; }
  .btn{ border:1.5px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 14px; font-weight:700; font-size:13.5px; }
  .btn:hover{ border-color:var(--seal); color:var(--seal); }
  .btn.primary{ background:var(--seal); border-color:var(--seal); color:#fff; }
  .btn.primary:hover{ filter:brightness(1.07); color:#fff; }
  .btn.sm{ padding:5px 10px; font-size:12.5px; border-radius:8px; }
  .btn.danger{ color:#C0392B; }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); }
  input[type=text], input[type=password]{ width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; font-size:15px; background:var(--surface-2); color:var(--ink); }
  .center-wrap{ min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ background:var(--surface); border:1.5px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:26px; width:min(420px,100%); }
  .card h2{ font-size:21px; margin-bottom:6px; text-align:center; }
  .card .sub{ text-align:center; color:var(--ink-soft); font-size:13px; margin:0 0 16px; }
  .card label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:12px 0 5px; }
  .err{ background:var(--seal-soft); color:#B23B32; border-radius:10px; padding:8px 12px; font-size:13px; margin-top:10px; display:none; }
  .shell{ display:flex; flex-direction:column; height:100%; }
  .top{ display:flex; align-items:center; gap:12px; padding:8px 16px; background:var(--surface); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .brand{ font-family:"LXGW WenKai TC",serif; font-size:19px; font-weight:700; letter-spacing:.04em; }
  .brand small{ font-family:"Plus Jakarta Sans",sans-serif; font-size:11.5px; color:var(--ink-soft); margin-left:6px; letter-spacing:0; }
  .top .grow{ flex:1; }
  .crumb{ font-size:13px; color:var(--ink-soft); font-weight:600; }
  .body{ flex:1; min-height:0; display:flex; }
  .side{ width:270px; flex:none; background:var(--surface); border-right:1px solid var(--line); overflow-y:auto; padding:12px; }
  .side h3{ font-size:13px; color:var(--ink-soft); margin:2px 0 8px; font-family:inherit; }
  .tree-school{ margin-bottom:8px; }
  .tree-row{ display:flex; align-items:center; gap:4px; padding:5px 6px; border-radius:8px; font-size:13.5px; font-weight:700; }
  .tree-row.school{ background:var(--surface-2); }
  .tree-row.term{ margin-left:12px; color:var(--ink-soft); font-size:13px; }
  .tree-row.cls{ margin-left:26px; cursor:pointer; font-weight:600; }
  .tree-row.cls:hover{ background:var(--seal-soft); }
  .tree-row.cls.on{ background:var(--seal); color:#fff; }
  .tree-row .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tree-row .mini{ border:none; background:transparent; font-size:12px; padding:2px 5px; border-radius:6px; opacity:.6; }
  .tree-row .mini:hover{ opacity:1; background:rgba(0,0,0,.07); }
  .main{ flex:1; min-width:0; overflow-y:auto; padding:18px clamp(12px,3vw,32px); }
  .main.flush{ padding:0; display:flex; flex-direction:column; overflow:hidden; }
  .empty{ text-align:center; color:var(--ink-soft); padding:60px 20px; }
  .head-row{ display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .head-row h2{ font-size:24px; }
  .chip{ display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line); }
  .code{ font-family:ui-monospace,monospace; letter-spacing:.12em; font-size:15px; font-weight:800; color:var(--seal); }
  .panel{ background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:16px; }
  .panel h3{ font-size:16px; margin-bottom:10px; }
  .tools{ display:flex; gap:8px; flex-wrap:wrap; }
  .lesson{ background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:12px; }
  .lesson .lh{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .lesson .lt{ font-family:"LXGW WenKai TC",serif; font-size:18px; font-weight:700; flex:1; min-width:150px; }
  .lesson .counts{ font-size:12.5px; color:var(--ink-soft); margin:4px 0 10px; }
  .toggles{ display:flex; gap:6px; flex-wrap:wrap; }
  .tg{ border:1.5px solid var(--line); background:var(--surface-2); border-radius:99px; padding:5px 12px; font-size:13px; font-weight:700; color:var(--ink-soft); }
  .tg.on{ background:var(--bamboo); border-color:var(--bamboo); color:#fff; }
  .tg.na{ opacity:.4; cursor:default; }
  .tabs{ display:flex; gap:4px; padding:8px 14px 0; background:var(--surface); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tab{ border:none; background:none; padding:9px 16px; font-size:14.5px; font-weight:700; color:var(--ink-soft); border-bottom:3px solid transparent; }
  .tab.on{ color:var(--seal); border-bottom-color:var(--seal); }
  .subbar{ display:flex; gap:6px; padding:8px 14px; flex-wrap:wrap; align-items:center; background:var(--paper); border-bottom:1px solid var(--line); }
  .frame{ flex:1; width:100%; border:0; background:var(--paper); min-height:0; }
  .note{ color:var(--ink-soft); font-size:13px; line-height:1.7; }
  .join{ display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  dialog{ border:none; border-radius:16px; padding:0; box-shadow:0 20px 40px rgba(0,0,0,.25); width:min(380px,92vw); }
  dialog::backdrop{ background:rgba(20,20,18,.5); }
  dialog form{ padding:20px; }
  dialog h3{ font-size:17px; margin-bottom:10px; }
  dialog .row{ display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .cal-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
  .cal-w{ text-align:center; font-size:12px; font-weight:700; color:var(--ink-soft); padding:2px 0; }
  .cal-d{ min-height:84px; background:var(--surface-2); border-radius:10px; padding:5px 6px; cursor:pointer; overflow:hidden; }
  .cal-d:hover{ outline:2px solid var(--seal); }
  .cal-d.empty{ background:transparent; cursor:default; } .cal-d.empty:hover{ outline:none; }
  .cal-d.today{ background:#F6DCCF; }
  .cal-n{ font-weight:700; font-size:13px; margin-bottom:2px; }
  .cal-s{ font-size:11px; line-height:1.35; color:var(--seal); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .slot{ display:flex; align-items:center; gap:14px; padding:10px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .slot:first-of-type{ border-top:none; }
  .slot-time{ font-weight:700; min-width:110px; font-variant-numeric:tabular-nums; }
  .slot-main{ flex:1; min-width:180px; }
  .slot-act{ display:flex; gap:6px; align-items:center; }
  #sch form label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:10px 0 4px; }
  #sch select, #sch input[type=date], #sch input[type=time], #sch input[type=text]{ width:100%; padding:8px 10px; border-radius:8px; border:1.5px solid var(--line); background:var(--surface-2); font:inherit; }
  @media (max-width:640px){ .cal-d{ min-height:60px; } .cal-s{ font-size:10px; } }
  .rec-form label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:14px 0 4px; }
  .rec-form input[type=text], .rec-form input[type=date], .rec-form input[type=number], .rec-form textarea{ width:100%; padding:8px 10px; border-radius:8px; border:1.5px solid var(--line); background:var(--surface-2); font:inherit; }
  .rstu{ border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:8px; background:var(--surface-2); }
  .rgrid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:8px 0 4px; }
  .rgrid input{ text-align:center; font-weight:700; background:var(--surface) !important; }
  @media (max-width:640px){ .rgrid{ grid-template-columns:repeat(3,1fr); } }
  .hw-table{ border-collapse:collapse; font-size:13px; }
  .hw-table th, .hw-table td{ border:1px solid var(--line); padding:6px 10px; text-align:center; white-space:nowrap; }
  .hw-table td:first-child, .hw-table th:first-child{ text-align:left; }
  .hw-table .st-ok{ background:#E3F1E8; } .hw-table .st-late{ background:#FBEBC8; } .hw-table .st-missing{ background:#F7D9D5; }
  .bd-wrap{ display:grid; grid-template-columns:300px 1fr; gap:16px; align-items:start; }
  .bd-cal{ position:sticky; top:8px; }
  @media (max-width:820px){ .bd-wrap{ grid-template-columns:1fr; } .bd-cal{ position:static; } }
  .mc-head{ display:flex; align-items:center; gap:6px; margin-bottom:8px; } .mc-head b{ flex:1; text-align:center; }
  .mc-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .mc-w{ text-align:center; font-size:11px; color:var(--ink-soft); font-weight:700; }
  .mc-d{ border:none; background:var(--surface-2); border-radius:8px; padding:4px 0 3px; min-height:40px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:13px; font-weight:700; color:var(--ink); cursor:pointer; }
  .mc-d.today{ background:#F6DCCF; } .mc-d.sel{ outline:2.5px solid var(--seal); background:#fff; }
  .mc-dots{ display:flex; gap:2px; min-height:7px; } .mc-dots i, i.dot{ display:inline-block; width:6px; height:6px; border-radius:50%; }
  .bd-card h3{ font-size:17px; } .bd-body{ line-height:1.75; } .bd-body ul{ margin:4px 0 4px 20px; }
  .bd-plan{ background:#E8F3EC; border-radius:10px; padding:8px 12px; margin:8px 0; }
  .cmt-row{ padding:6px 0; border-top:1px solid var(--line); }
  #hwed{ max-height:92vh; overflow-y:auto; } #hwed select, #hwed input[type=date], #hwed input[type=time], #hwed input[type=text], #hwed textarea{ width:100%; padding:8px 10px; border-radius:8px; border:1.5px solid var(--line); background:var(--surface-2); font:inherit; }
  .cal-title{ font-size:16px; font-weight:800; padding:6px 12px; }
  .cal-pick{ background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:10px; margin:0 0 10px; box-shadow:var(--shadow); max-width:360px; }
  .cp-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; } .cp-head b{ flex:1; text-align:center; }
  .cp-year{ font-size:15px; font-weight:800; flex:1; }
  .cp-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .cp-b{ border:1.5px solid var(--line); background:var(--surface-2); border-radius:10px; padding:10px 0; font-weight:700; font-size:14px; color:var(--ink); cursor:pointer; }
  .cp-b.cur{ outline:2px solid var(--line); } .cp-b.sel{ background:var(--seal); border-color:var(--seal); color:#fff; }
  .cal-cnt{ display:none; }
  body.ta .owner-only, body.ta .danger{ display:none !important; }
  @media (pointer:coarse), (max-width:1024px){
    .btn{ min-height:42px; } .btn.sm{ min-height:38px; padding:7px 12px; }
    input[type=text], input[type=password], input[type=date], input[type=time], input[type=number], select, textarea{ font-size:16px !important; }
    .tab{ padding:11px 14px; }
  }
  @media (max-width:640px){
    .top{ padding:6px 10px; gap:6px; } .top .crumb{ order:3; width:100%; }
    .head-row > div{ min-width:100%; }
    .slot{ gap:8px; } .slot-time{ min-width:0 !important; }
    .slot-act{ width:100%; flex-wrap:wrap; }
    .cal-s{ display:none; } .cal-cnt{ display:block; font-size:11px; color:var(--seal); font-weight:700; }
    .hw-table th, .hw-table td{ padding:5px 6px; font-size:12px; }
    .main{ padding:12px 10px; }
    .tabs{ overflow-x:auto; flex-wrap:nowrap; } .tab{ white-space:nowrap; }
    dialog{ width:94vw !important; }
  }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:9px 16px; border-radius:99px; font-size:13px; z-index:9999; }
  @media (max-width:820px){ .side{ display:none; } .side.show{ display:block; position:fixed; z-index:50; top:48px; bottom:0; left:0; box-shadow:var(--shadow); } .menu-btn{ display:inline-block !important; } }
  .menu-btn{ display:none; }
  .crumb a.cr{ color:var(--seal); text-decoration:none; } .crumb a.cr:hover{ text-decoration:underline; }
  .shell.focus .top, .shell.focus .side{ display:none; }
  .shell.focus .main:not(.flush){ padding:12px; }
  .tab.focus-btn{ margin-left:auto; color:var(--seal); border:1.5px solid var(--seal); border-radius:10px; padding:4px 12px; margin-bottom:5px; font-size:13px; }
</style>

<div id="root"></div>
<dialog id="unitdlg"><form method="dialog"><h3 id="unit-t">複習單元</h3><label style="display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:4px 0 5px;">名稱</label><input type="text" id="unit-name" autocomplete="off" placeholder="例如：第一到六課複習"><label style="display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:12px 0 5px;">包含哪幾課（教材與活動會合併這幾課的生詞）</label><div id="unit-lessons" style="display:flex;flex-wrap:wrap;gap:8px;"></div><div class="row"><button type="button" class="btn" id="unit-no">取消</button><button type="submit" class="btn primary">儲存</button></div></form></dialog>
<dialog id="sch" style="width:min(460px,94vw);"><form method="dialog"><h3 id="sch-t"></h3><label>班級</label><select id="sch-c"></select><label>日期</label><input type="date" id="sch-d"><div style="display:flex;gap:10px;"><div style="flex:1;"><label>開始</label><input type="time" id="sch-s"></div><div style="flex:1;"><label>結束</label><input type="time" id="sch-e"></div></div><label>要上哪一課（可不選）</label><select id="sch-l"></select><label>備註（例如第二節改線上）</label><input type="text" id="sch-n"><div id="sch-rep" style="margin-top:12px;font-size:13px;"><label style="display:flex;align-items:center;gap:6px;font-weight:600;margin:0;"><input type="checkbox" id="sch-r"> 每週同一時間重複，共 <input type="number" id="sch-w" value="8" min="2" max="40" style="width:64px;"> 週</label></div><div class="row"><button type="button" class="btn" id="sch-no">取消</button><button type="submit" class="btn primary">儲存</button></div></form></dialog>
<dialog id="remind" style="width:min(420px,92vw);"><form method="dialog"><h3>📝 該填課堂記錄表了</h3><p id="remind-t" style="margin:6px 0 4px;font-weight:700;"></p><p class="note">趁記憶還新鮮，趕快記下今天的上課內容和學生表現吧。</p><div class="row" style="flex-wrap:wrap;"><button type="button" class="btn" id="remind-skip">今天不用提醒</button><button type="button" class="btn" id="remind-later">10 分鐘後再提醒</button><button type="button" class="btn primary" id="remind-go">填寫課堂記錄</button></div></form></dialog>
<dialog id="bell-d" style="width:min(460px,94vw);"><form method="dialog" onsubmit="return false;"><h3>🔔 新的繳交</h3><div id="bell-list" style="max-height:50vh;overflow-y:auto;"></div><div class="row" style="flex-wrap:wrap;"><button type="button" class="btn sm" id="bell-perm" style="display:none;">開啟桌面通知</button><button type="button" class="btn" id="bell-clear">全部標為已讀</button><button type="button" class="btn primary" id="bell-close">關閉</button></div></form></dialog>
<dialog id="hwed"></dialog>
<dialog id="pick"><form method="dialog"><h3 id="pick-t"></h3><select id="pick-s" style="width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font:inherit;"></select><div class="row"><button type="button" class="btn" id="pick-no">取消</button><button type="submit" class="btn primary" id="pick-ok">確定</button></div></form></dialog>
<dialog id="ask"><form method="dialog"><h3 id="ask-t"></h3><input type="text" id="ask-i" autocomplete="off"><div class="row"><button type="button" class="btn" id="ask-no">取消</button><button type="submit" class="btn primary" id="ask-ok">確定</button></div></form></dialog>

<script>
(function(){
"use strict";
var SESSION_KEY = "hanyu_mandamy_teacher_session"; // 跟教材頁、簡報頁共用，登入一次三邊都通

function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function uid(p){ return p + Math.random().toString(36).slice(2, 9); }
function toast(msg){ var t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2200); }
function askText(title, value, okLabel, type){
  return new Promise(function(resolve){
    var d = document.getElementById("ask"), i = document.getElementById("ask-i"); i.type = type || "text";
    document.getElementById("ask-t").textContent = title; i.value = value || "";
    document.getElementById("ask-ok").textContent = okLabel || "確定";
    var done = false;
    function fin(v){ if(done) return; done = true; i.type = "text"; try{ d.close(); }catch(e){} resolve(v); }

    d.querySelector("form").onsubmit = function(e){ e.preventDefault(); var v = i.value.trim(); fin(v || null); };
    d.showModal(); setTimeout(function(){ i.focus(); i.select(); }, 30);
  });
}
function askChoice(title, groups, okLabel){
  // groups: [{ label, items: [{ v, t }] }]

// 嵌入教材頁用的課次參數；目前只有預設教材（第一冊）有雲端生詞庫，其他教材回傳 null

// 層級改成「年度 › 學校 › 班級」：資料路徑不變（schools 這層現在放年度、terms 這層放學校），舊資料（學校›學期）自動轉過來，舊版先備份
async function migrateHier(){
  var base = "teacherPlatform/" + S.teacher.id;
  if(S.plat.hier === 2) return;
  var old = S.plat.schools || {}, hasOld = Object.keys(old).length > 0;
  if(hasOld){
    try{ await fbSet(base + "/schoolsBackupV1", old); }catch(e){ return; }
    var years = {}, byName = {};
    Object.keys(old).forEach(function(sid){
      var sc = old[sid], terms = sc.terms || {};
      Object.keys(terms).forEach(function(tid){
        var tm = terms[tid], yid = byName[tm.name];
        if(!yid){ yid = uid("y_"); byName[tm.name] = yid; years[yid] = { name: tm.name, order: tm.order || Date.now(), terms: {} }; }
        years[yid].terms[sid] = { name: sc.name, order: sc.order || 0, classes: tm.classes || {} };
      });
      // 沒有任何學期的學校：放進一個「未分年度」
      if(!Object.keys(terms).length){
        var yid2 = byName["未分年度"]; if(!yid2){ yid2 = uid("y_"); byName["未分年度"] = yid2; years[yid2] = { name: "未分年度", order: 0, terms: {} }; }
        years[yid2].terms[sid] = { name: sc.name, order: sc.order || 0, classes: {} };
      }
    });
    await fbSet(base + "/schools", years);
    var ys = Object.keys(years);
    for(var i = 0; i < ys.length; i++){ var sch = years[ys[i]].terms; for(var sk in sch){ var cl = sch[sk].classes || {}; for(var ck in cl){ if(cl[ck].code) try{ await fbSet("classCodes/" + cl[ck].code, { t: S.teacher.id, s: ys[i], tm: sk, c: ck }); }catch(e){} } } }
    S.plat.schools = years;
  }
  await fbSet(base + "/hier", 2); S.plat.hier = 2;
}

// 把「雲端生詞庫」跟「測驗庫」整理成一份輕量的課次索引（學生端只讀這一份，不必下載整個測驗庫）
async function syncLessonIndex(){
  var t = S.teacher.id, bank = null, lib = null;
  try{ bank = await fbGet("teacherVocabBanks/" + t); }catch(e){}
  S.bank = (bank && Array.isArray(bank.courseData)) ? bank.courseData : [];
  try{ lib = await fbGet("teacherLibraries/" + t); }catch(e){}
  var lessons = {}, lm = S.plat.lessonMap || {};
  // 雲端生詞庫：沒有標「book」的課次都算預設教材（第一冊）
  if(bank && Array.isArray(bank.courseData)) bank.courseData.forEach(function(l){
    var b = l.book || DEFAULT_BOOK, k = lkey(b, l.lesson);
    lessons[k] = { book: b, no: Number(l.lesson), title: l.title || "", counts: { vocab: (l.vocab || []).length, grammar: (l.grammar || []).length, text: (l.texts || []).length }, projects: {} };
  });
  // 老師自己新增的課次（例如其他教材、還沒有生詞也想先建好的課）
  var cl = S.plat.customLessons || {};
  Object.keys(cl).forEach(function(k){ if(!booksObj()[cl[k].book]) return; if(!lessons[k]) lessons[k] = { book: cl[k].book, no: Number(cl[k].no), title: cl[k].title || "", counts: {}, projects: {} }; else if(!lessons[k].title && cl[k].title) lessons[k].title = cl[k].title; });
  // 複習單元：成員是課次的 key；生詞／語法／課文數量是成員的總和
  var units = S.plat.units || {};
  Object.keys(units).forEach(function(uk){
    var u = units[uk], c = { vocab: 0, grammar: 0, text: 0 }, mem = (u.lessons || []).map(String);
    mem.forEach(function(k){ var ll = lessons[k]; if(ll && ll.counts){ c.vocab += ll.counts.vocab || 0; c.grammar += ll.counts.grammar || 0; c.text += ll.counts.text || 0; } });
    lessons[uk] = { unit: true, title: u.title || "", members: mem, order: u.order || 0, counts: c, projects: {} };
  });
  var unassigned = {}, allProjects = {};
  if(lib && lib.projects) Object.keys(lib.projects).forEach(function(pid){
    var p = lib.projects[pid], key = lm[pid] == null ? null : String(lm[pid]);
    if(key == null){
      var guess = lessonFromTitle(p.title);
      if(guess != null){ var gb = bookFromTitle(p.title) || DEFAULT_BOOK; key = lkey(gb, guess); lm[pid] = key; }
    }
    var slides = 0, quiz = 0;
    Object.keys(p.sections || {}).forEach(function(sid){ var sc = p.sections[sid], n = Object.keys(sc.questions || {}).length; if(sc.type === "board") slides += n; else quiz += n; });
    allProjects[pid] = { title: p.title, slides: slides, quiz: quiz };
    if(key == null){ unassigned[pid] = { title: p.title, slides: slides, quiz: quiz }; return; }
    if(key.indexOf("u_") === 0 && !lessons[key]){ unassigned[pid] = { title: p.title, slides: slides, quiz: quiz }; return; } // 歸去的複習單元已被刪除
    if(!lessons[key]){
      var pk = parseKey(key);
      if(!pk || !booksObj()[pk.book]){ unassigned[pid] = { title: p.title, slides: slides, quiz: quiz }; return; }
      lessons[key] = { book: pk.book, no: pk.no, title: (p.title || "").replace(/^第\s*[0-9零〇一二兩三四五六七八九十]+\s*課\s*/, ""), counts: {}, projects: {} };
    }

  });
  S.plat.lessons = lessons; S.plat.lessonMap = lm; S.unassigned = unassigned; S.allProjects = allProjects;
  var base = "teacherPlatform/" + t;
  try{ await fbUpdate(base, { lessons: lessons, lessonMap: lm, books: booksObj() }); }catch(e){ console.error("寫入課次索引失敗（可能是 Firebase 規則還沒開放 teacherPlatform）", e); S.ruleErr = true; }
}

function restoreFromHash(){

  S.lesson = h.get("l") || null; S.tab = h.get("tab") || null; S.sub = h.get("sub") || null;
}
function saveHash(){

}

function navSnap(){

    return { k: "t", sel: S.sel ? { s: S.sel.s, t: S.sel.t || null, c: S.sel.c || null } : null, lesson: S.lesson || null, tab: S.tab || null, sub: S.sub || null,

function navPush(url){

async function schedAct(a, ds){
  var base = "teacherPlatform/" + S.teacher.id + "/schedule", m = schedMap();
  if(a.indexOf("cp-") === 0){ if(calPickAct(a, ds, S.month || ymd(new Date()).slice(0, 7), function(ym){ S.month = ym; })) render(); return; }
  if(a === "cal-prev" || a === "cal-next"){
    var yy = Number(S.month.slice(0, 4)), mm = Number(S.month.slice(5, 7)) - 1 + (a === "cal-next" ? 1 : -1), nd = new Date(yy, mm, 1);
    S.month = nd.getFullYear() + "-" + pad2(nd.getMonth() + 1); S.calPick = null; render(); return;
  }
  if(a === "cal-today"){ S.month = ymd(new Date()).slice(0, 7); S.calPick = null; render(); return; }
  if(a === "cal-day"){ S.day = ds.d; render(); return; }
  if(a === "cal-back"){ S.day = null; render(); return; }
  if(a === "slot-rec"){ if(m[ds.id]) openRecordFor(Object.assign({ id: ds.id }, m[ds.id])); return; }
  if(a === "slot-go"){
    var sl = m[ds.id]; if(!sl || !classInfo(sl)) return;
    S.day = null; S.sel = { s: sl.s, t: sl.t, c: sl.c }; S.lesson = (sl.lesson && (S.plat.lessons || {})[sl.lesson]) ? sl.lesson : null; S.tab = null; S.sub = null; render(); return;
  }

    if(a === "slot-edit"){
      var rec = Object.assign({}, m[ds.id], { s: r.s, t: r.t, c: r.c, date: r.date, start: r.start, end: r.end, lesson: r.lesson, note: r.note });

        var id = uid("sl_"), rec2 = { s: r.s, t: r.t, c: r.c, date: ymd(dd), start: r.start, end: r.end, lesson: r.lesson, note: r.note, series: series };
        m[id] = rec2; await fbSet(base + "/" + id, rec2);

    }
    if(S.day && S.day !== r.date && a === "slot-edit") S.day = r.date;
    render(); setTimeout(checkReminders, 400); return;
  }
  if(a === "slot-del"){
    var sd = m[ds.id]; if(!sd) return;
    if(!confirm("刪除這一堂課（" + sd.date + " " + (sd.start || "") + " " + slotLabel(sd) + "）？")) return;
    var ids = [ds.id];
    if(sd.series && confirm("這是每週重複的課。要連同「之後」同系列的課也一起刪除嗎？\n（按取消只刪除這一堂）")){
      Object.keys(m).forEach(function(k){ if(k !== ds.id && m[k].series === sd.series && m[k].date > sd.date) ids.push(k); });
    }
    for(var j = 0; j < ids.length; j++){ delete m[ids[j]]; await fbSet(base + "/" + ids[j], null); }
    render(); return;
  }
}

function shrinkImage(file){
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onload = function(){ var im = new Image(); im.onload = function(){ var sc = Math.min(1, 1100 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); resolve(c.toDataURL("image/jpeg", 0.72)); }; im.onerror = reject; im.src = fr.result; };
    fr.onerror = reject; fr.readAsDataURL(file);
  });
}

var TIME_OFF = 0, TIME_OK = false;
async function syncTime(){
  var off = null;
  try{
    off = await new Promise(function(res){
      var done = false; var to = setTimeout(function(){ if(!done){ done = true; res(null); } }, 3000);
      try{ window.onValue(window.ref(window.db, ".info/serverTimeOffset"), function(snap){ if(done) return; done = true; clearTimeout(to); var v = snap.val(); res(typeof v === "number" ? v : null); }); }catch(e){ done = true; clearTimeout(to); res(null); }
    });
  }catch(e){}
  if(off == null){
    try{
      var t0 = Date.now(), r = await fetch(location.pathname + "?t=" + t0, { method: "HEAD", cache: "no-store" }), dh = r.headers.get("date");
      if(dh){ off = new Date(dh).getTime() - (t0 + (Date.now() - t0) / 2); }
    }catch(e){}
  }
  if(off != null){ TIME_OFF = off; TIME_OK = true; } else TIME_OK = false;
  return TIME_OK;
}

  if(!rec.createdAt) rec.createdAt = nowMs();
  await fbSet(accPath(tid, cid, name), rec); return rec;
}

async function studentAuth(idx, name, pw){
  // 回傳 true＝通過；字串＝要顯示給學生的錯誤訊息
  var tid = idx.t, cid = idx.c, path = accPath(tid, cid, name);
  var acct = await fbGet(path);
  if(!acct) return "找不到「" + name + "」的帳號。請確認名字跟老師給的一樣，或請老師建立帳號。";
  await syncTime(); var now = nowMs();
  if(acct.lockUntil && acct.lockUntil > now) return "密碼輸入錯太多次了，請 " + Math.ceil((acct.lockUntil - now) / 60000) + " 分鐘後再試，或請老師幫你解鎖。";
  var sessKey = "mm_stu_" + cid + "_" + hwSkey(name), sess = null; try{ sess = localStorage.getItem(sessKey); }catch(e){}
  if(!pw){ if(sess && sess === acct.hashHex && !acct.mustChange) return true; return "這個班需要密碼，請輸入你的密碼。"; }
  var ok = (await pbkdf2(pw, acct.saltHex)) === acct.hashHex;
  if(!ok){
    var fails = (acct.fails || 0) + 1, patch = { fails: fails };
    if(fails >= 5){ patch.lockUntil = now + 10 * 60000; patch.fails = 0; }
    try{ await fbUpdate(path, patch); }catch(e){}
    return fails >= 5 ? "密碼錯太多次，已暫時鎖定 10 分鐘。" : "密碼不對（再錯 " + (5 - fails) + " 次會暫時鎖定）。";
  }
  var cur = acct;
  if(acct.mustChange){
    var np = null;
    for(var tries = 0; tries < 5; tries++){
      var a1 = await askText("第一次登入，請設定你自己的新密碼（至少 6 個字）", "", "下一步", "password"); if(!a1) return "需要先設定新密碼才能進入。";
      if(a1.length < 6){ alert("密碼至少要 6 個字。"); continue; }
      if(a1 === pw){ alert("新密碼不能跟初始密碼一樣。"); continue; }
      var a2 = await askText("再輸入一次新密碼", "", "確定", "password"); if(!a2) return "需要先設定新密碼才能進入。";
      if(a1 !== a2){ alert("兩次輸入不一樣，請再試一次。"); continue; }
      np = a1; break;
    }
    if(!np) return "新密碼沒有設定成功，請重試。";
    cur = await accSetPassword(tid, cid, name, np, false, { createdAt: acct.createdAt });
  } else if(acct.fails){ try{ await fbUpdate(path, { fails: 0 }); }catch(e){} }
  try{ await fbUpdate(path, { lastLogin: now }); localStorage.setItem(sessKey, cur.hashHex); }catch(e){}
  return true;
}
async function studentChangePassword(){
  var st = S.student, tid = st.idx.t, cid = st.idx.c, acct = await fbGet(accPath(tid, cid, st.name));
  if(!acct){ alert("找不到你的帳號。"); return; }

  if((await pbkdf2(old, acct.saltHex)) !== acct.hashHex){ alert("目前的密碼不對。"); return; }
  var a1 = await askText("新密碼（至少 6 個字）", "", "下一步", "password"); if(!a1) return;
  if(a1.length < 6){ alert("密碼至少要 6 個字。"); return; }
  var a2 = await askText("再輸入一次新密碼", "", "確定", "password"); if(!a2) return;
  if(a1 !== a2){ alert("兩次輸入不一樣。"); return; }
  var rec = await accSetPassword(tid, cid, st.name, a1, false, { createdAt: acct.createdAt, lastLogin: acct.lastLogin });
  try{ localStorage.setItem("mm_stu_" + cid + "_" + hwSkey(st.name), rec.hashHex); }catch(e){}
  toast("已更新密碼");
}

  html += '<div class="panel" style="text-align:center;"><canvas id="wheel" width="420" height="420" style="max-width:100%;"></canvas><div id="wres" style="font-size:28px;font-weight:700;margin:10px 0;min-height:40px;"></div><div class="tools" style="justify-content:center;"><button class="btn primary" data-h="spin">轉！</button><label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="wnorep" checked> 抽過的不再抽</label><button class="btn sm" data-h="reset">重新開始</button></div><div class="note" id="wleft"></div></div>';
  shell(html); setCrumb([]);
  var cv = document.getElementById("wheel"), ctx = cv.getContext("2d"), pool = roster.slice(), ang = 0, spinning = false;
  var cols = ["#E8896A", "#F2B25E", "#7DB69A", "#6FA8C9", "#B79AD1", "#E3A0B5"];

    for(var i = 0; i < n; i++){

      ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, R, a0, a1); ctx.closePath(); ctx.fillStyle = cols[i % cols.length]; ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
      ctx.save(); ctx.translate(c, c); ctx.rotate((a0 + a1) / 2); ctx.fillStyle = "#222"; ctx.font = (n > 18 ? 13 : 18) + "px sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillText(pool[i], R - 14, 0); ctx.restore();
    }

  }

    var b = e.target.closest("[data-h]"); if(!b) return; var a = b.dataset.h;

function reviewWords(label){

    var age = Math.round((today - new Date(r.date + "T00:00:00").getTime()) / 86400000);
    if(age < 0 || age > 30) return;
    (r.vocab || []).forEach(function(v){
      if(!v.word || seen[v.word]) return; seen[v.word] = 1;
      (age <= 3 ? buckets.a : age <= 10 ? buckets.b : buckets.c).push({ word: v.word, sub: v.sub || "", date: r.date });
    });
  });
  return buckets;
}

// ----- 學期評語 -----
var DIM_TIP = { listening: "平時多聽課文錄音、模仿語調", speaking: "鼓勵大聲開口，練習把話說成完整的句子", reading: "每天讀一小段課文，留意生字詞", writing: "多練習筆順與造句，寫完再檢查一遍", participation: "多舉手發言、主動提問，讓學習更有參與感" };
function hashStr(s){ var h = 0; for(var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
function pick(arr, seed, k){ return arr[(seed + (k || 0)) % arr.length]; }
function levelWord(p){ return p >= 90 ? "非常優異" : p >= 80 ? "良好" : p >= 70 ? "穩定" : p >= 60 ? "尚可" : "還需要加強"; }
function studentStats(label, name, range){
  var recs = recsOf(label).filter(function(r){ return (!range.from || r.date >= range.from) && (!range.to || r.date <= range.to); });
  var present = 0, absent = 0, scored = [], notes = [], words = {};
  recs.forEach(function(r){
    if(r.isAbsence) return;
    (r.vocab || []).forEach(function(v){ if(v.word) words[v.word] = 1; });
    var mine = (r.students || []).filter(function(s){ return (s.name || "").trim() === name; })[0];
    if(!mine) return;
    if(mine.absent){ absent++; return; }
    present++;
    if(hasScore(mine)) scored.push({ date: r.date, st: mine, total: stTotal(mine) });
    if((r.students || []).length === 1 && (r.notes || "").trim()) notes.push({ date: r.date, text: r.notes.trim() });
  });
  var dims = {}; RUBRIC.forEach(function(rb){ var vs = scored.map(function(p){ return p.st[rb.key]; }).filter(function(v){ return typeof v === "number"; }); dims[rb.key] = vs.length ? vs.reduce(function(a, b){ return a + b; }, 0) / vs.length / rb.max * 100 : null; });
  var tot = scored.length ? scored.reduce(function(a, p){ return a + p.total; }, 0) / scored.length : null, trend = null;
  if(scored.length >= 4){ var k = Math.ceil(scored.length / 3), avg = function(a){ return a.reduce(function(x, p){ return x + p.total; }, 0) / a.length; }; trend = avg(scored.slice(-k)) - avg(scored.slice(0, k)); }
  return { present: present, absent: absent, sessions: present + absent, rate: (present + absent) ? Math.round(present * 100 / (present + absent)) : null, dims: dims, total: tot, trend: trend, words: Object.keys(words), notes: notes, scored: scored.length };
}
function composeComment(name, st, o, hw){
  var seed = hashStr(name), p = [];
  if(st.sessions === 0 || st.total == null) return "（這段期間內，" + name + "的課堂記錄分數不足，無法產生評語。請確認記錄表裡的學生姓名跟這裡一樣，並且有填分數。）";
  var warm = o.tone === "warm", formal = o.tone === "formal", short = o.length === "short", long = o.length === "long";
  if(o.attend){
    var a = st.rate >= 95 ? pick(["幾乎全勤，學習態度十分認真。", "出席非常穩定，值得肯定。"], seed) : st.rate >= 85 ? "出席狀況良好。" : "有幾堂課缺席，希望之後能盡量補上進度。";
    p.push(name + "同學本學期共上了 " + st.sessions + " 堂課，出席率 " + st.rate + "%，" + a);
  } else p.push(name + "同學本學期的學習表現如下。");
  var dimArr = RUBRIC.map(function(rb){ return { key: rb.key, label: rb.label, pct: st.dims[rb.key] }; }).filter(function(x){ return x.pct != null; }).sort(function(a, b){ return b.pct - a.pct; });
  p.push("整體表現" + levelWord(st.total) + "（課堂平均 " + st.total.toFixed(0) + " 分）。");
  if(o.dims && dimArr.length >= 2){
    var best = dimArr[0], worst = dimArr[dimArr.length - 1];
    if(best.pct - worst.pct >= 8 || !short){
      p.push(pick(["在" + best.label + "方面表現最為突出", "「" + best.label + "」是" + name + "目前最強的一項"], seed, 1) + "，平均達 " + best.pct.toFixed(0) + "%" + (worst.pct < 75 ? "；" + worst.label + "（平均 " + worst.pct.toFixed(0) + "%）還有成長空間，建議" + DIM_TIP[worst.key] + "。" : "。"));
    }
  }
  if(o.trend && st.trend != null && !short){
    p.push(st.trend >= 5 ? pick(["從學期初到學期末，進步幅度相當明顯，看得出平時的努力。", "學習曲線持續向上，這份進步很不容易。"], seed, 2) : st.trend <= -5 ? "學期後段的表現略有起伏，期待調整步調、穩定發揮。" : "整個學期的學習表現十分穩定。");
  }
  if(o.vocab && st.words.length && long){
    p.push("本學期班上累積學習了 " + st.words.length + " 個生詞，例如「" + st.words.slice(0, 5).join("、") + "」等，建議持續複習。");
  }
  if(o.hw && hw && hw.total){

function parseBatchHw(text){
  var out = [], now = new Date(), yy = now.getFullYear();
  text.split("\n").forEach(function(line){
    line = line.trim(); if(!line) return;
    var m = /^(?:(\d{4})[-\/])?(\d{1,2})[-\/](\d{1,2})\s*(?:(\d{1,2}):(\d{2}))?\s+(.+)$/.exec(line); if(!m) return;
    var rest = m[6].split("|"), title = rest[0].trim(), body = (rest[1] || "").trim(); if(!title) return;
    out.push({ title: title, body: body, due: (m[1] || yy) + "-" + pad2(Number(m[2])) + "-" + pad2(Number(m[3])) + "T" + (m[4] ? pad2(Number(m[4])) + ":" + m[5] : "23:59") });
  });
  return out;
}

  var live = S.live;
  S.focus = true;
  var key = [live.lesson, live.tab, live.sub, live.room].join("|");
  if(S.liveRendered === key && document.getElementById("main")) return;
  S.liveRendered = key;
  if(!live.lesson){
    shell('<div class="empty"><h2 style="margin-bottom:8px;">老師準備中</h2><p class="note">課程馬上開始，請稍候…</p></div>');
    return;
  }
  S.lesson = String(live.lesson); S.tab = live.tab; S.sub = live.sub;
  var all = { vocab: 1, grammar: 1, text: 1, slides: 1, quiz: 1, activities: 1 };
  var r = renderLessonCommon(S.lesson, all, false, true);
  shell(r.html, { flush: true });
}
// ---------- 啟動 ----------
window.__mm = { get S(){ return S; }, render: function(){ return render(); }, newRecordDraft: newRecordDraft, ymd: ymd };
(async function boot(){
  root.innerHTML = '<div class="center-wrap"><div class="note">連線中…</div></div>';
  var ok = await waitFirebase();
  if(!ok){ root.innerHTML = '<div class="center-wrap"><div class="card"><h2>無法連線</h2><p class="sub">請檢查網路連線後重新整理。</p><button class="btn primary" style="width:100%" onclick="location.reload()">重試</button></div></div>'; return; }
  var ptok = params.get("parent"); if(ptok){ await viewParent(ptok); return; }
  var code = (params.get("class") || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
  if(code){
    var saved = ""; try{ saved = localStorage.getItem("mm_student_name") || ""; }catch(e){}
    var qn = params.get("name"); var nm = qn || saved;
    if(nm){ await startStudent(code, nm); } else viewStudentEntry("", code);
    return;
  }
  var sid = null; try{ sid = localStorage.getItem(SESSION_KEY); }catch(e){}
  if(sid){
    try{
      var acc = await fbGet("teacherAccounts/" + sid);
      var tow = null; try{ tow = localStorage.getItem("mm_ta_owner"); }catch(e){}
      if(acc && !acc.disabled){ await startTeacher(acc, tow); return; }
    }catch(e){}
  }
  viewLogin();
})();
})();
</script>
