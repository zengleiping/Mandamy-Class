<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>曼米中文平台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap">
<style>
  :root{ --paper:#FAF7F2; --surface:#fff; --surface-2:#F2EAE0; --ink:#2B2320; --ink-soft:#6B5F55; --line:rgba(43,35,32,.12); --seal:#E8825A; --seal-soft:#FBE8DE; --bamboo:#4C8577; --bamboo-soft:#E3F0EC; --shadow:0 8px 24px -10px rgba(28,33,30,.18); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  #root{ height:100%; }
  a.btn{ text-decoration:none; color:var(--ink); display:inline-block; }
  body{ background:var(--paper); color:var(--ink); font-family:"Plus Jakarta Sans","Noto Sans TC",-apple-system,sans-serif; -webkit-tap-highlight-color:transparent; }
  h1,h2,h3{ font-family:"LXGW WenKai TC","Noto Serif TC",serif; margin:0; }
  button{ font:inherit; color:inherit; cursor:pointer; }
  .btn{ border:1.5px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 14px; font-weight:700; font-size:13.5px; }
  .btn:hover{ border-color:var(--seal); color:var(--seal); }
  .btn.primary{ background:var(--seal); border-color:var(--seal); color:#fff; }
  .btn.primary:hover{ filter:brightness(1.07); color:#fff; }
  .btn.sm{ padding:5px 10px; font-size:12.5px; border-radius:8px; }
  .btn.danger{ color:#C0392B; }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); }
  input[type=text], input[type=password]{ width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; font-size:15px; background:var(--surface-2); color:var(--ink); }
  .center-wrap{ min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ background:var(--surface); border:1.5px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:26px; width:min(420px,100%); }
  .card h2{ font-size:21px; margin-bottom:6px; text-align:center; }
  .card .sub{ text-align:center; color:var(--ink-soft); font-size:13px; margin:0 0 16px; }
  .card label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:12px 0 5px; }
  .err{ background:var(--seal-soft); color:#B23B32; border-radius:10px; padding:8px 12px; font-size:13px; margin-top:10px; display:none; }
  .shell{ display:flex; flex-direction:column; height:100%; }
  .top{ display:flex; align-items:center; gap:12px; padding:8px 16px; background:var(--surface); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .brand{ font-family:"LXGW WenKai TC",serif; font-size:19px; font-weight:700; letter-spacing:.04em; }
  .brand small{ font-family:"Plus Jakarta Sans",sans-serif; font-size:11.5px; color:var(--ink-soft); margin-left:6px; letter-spacing:0; }
  .top .grow{ flex:1; }
  .crumb{ font-size:13px; color:var(--ink-soft); font-weight:600; }
  .body{ flex:1; min-height:0; display:flex; }
  .side{ width:270px; flex:none; background:var(--surface); border-right:1px solid var(--line); overflow-y:auto; padding:12px; }
  .side h3{ font-size:13px; color:var(--ink-soft); margin:2px 0 8px; font-family:inherit; }
  .tree-school{ margin-bottom:8px; }
  .tree-row{ display:flex; align-items:center; gap:4px; padding:5px 6px; border-radius:8px; font-size:13.5px; font-weight:700; }
  .tree-row.school{ background:var(--surface-2); }
  .tree-row.term{ margin-left:12px; color:var(--ink-soft); font-size:13px; }
  .tree-row.cls{ margin-left:26px; cursor:pointer; font-weight:600; }
  .tree-row.cls:hover{ background:var(--seal-soft); }
  .tree-row.cls.on{ background:var(--seal); color:#fff; }
  .tree-row .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tree-row .mini{ border:none; background:transparent; font-size:12px; padding:2px 5px; border-radius:6px; opacity:.6; }
  .tree-row .mini:hover{ opacity:1; background:rgba(0,0,0,.07); }
  .main{ flex:1; min-width:0; overflow-y:auto; padding:18px clamp(12px,3vw,32px); }
  .main.flush{ padding:0; display:flex; flex-direction:column; overflow:hidden; }
  .empty{ text-align:center; color:var(--ink-soft); padding:60px 20px; }
  .head-row{ display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .head-row h2{ font-size:24px; }
  .chip{ display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line); }
  .code{ font-family:ui-monospace,monospace; letter-spacing:.12em; font-size:15px; font-weight:800; color:var(--seal); }
  .panel{ background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:16px; }
  .panel h3{ font-size:16px; margin-bottom:10px; }
  .tools{ display:flex; gap:8px; flex-wrap:wrap; }
  .lesson{ background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:12px; }
  .lesson .lh{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .lesson .lt{ font-family:"LXGW WenKai TC",serif; font-size:18px; font-weight:700; flex:1; min-width:150px; }
  .lesson .counts{ font-size:12.5px; color:var(--ink-soft); margin:4px 0 10px; }
  .toggles{ display:flex; gap:6px; flex-wrap:wrap; }
  .tg{ border:1.5px solid var(--line); background:var(--surface-2); border-radius:99px; padding:5px 12px; font-size:13px; font-weight:700; color:var(--ink-soft); }
  .tg.on{ background:var(--bamboo); border-color:var(--bamboo); color:#fff; }
  .tg.na{ opacity:.4; cursor:default; }
  .tabs{ display:flex; gap:4px; padding:8px 14px 0; background:var(--surface); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tab{ border:none; background:none; padding:9px 16px; font-size:14.5px; font-weight:700; color:var(--ink-soft); border-bottom:3px solid transparent; }
  .tab.on{ color:var(--seal); border-bottom-color:var(--seal); }
  .subbar{ display:flex; gap:6px; padding:8px 14px; flex-wrap:wrap; align-items:center; background:var(--paper); border-bottom:1px solid var(--line); }
  .frame{ flex:1; width:100%; border:0; background:var(--paper); min-height:0; }
  .note{ color:var(--ink-soft); font-size:13px; line-height:1.7; }
  .join{ display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  dialog{ border:none; border-radius:16px; padding:0; box-shadow:0 20px 40px rgba(0,0,0,.25); width:min(380px,92vw); }
  dialog::backdrop{ background:rgba(20,20,18,.5); }
  dialog form{ padding:20px; }
  dialog h3{ font-size:17px; margin-bottom:10px; }
  dialog .row{ display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:9px 16px; border-radius:99px; font-size:13px; z-index:9999; }
  @media (max-width:820px){ .side{ display:none; } .side.show{ display:block; position:fixed; z-index:50; top:48px; bottom:0; left:0; box-shadow:var(--shadow); } .menu-btn{ display:inline-block !important; } }
  .menu-btn{ display:none; }
  .crumb a.cr{ color:var(--seal); text-decoration:none; } .crumb a.cr:hover{ text-decoration:underline; }
  .shell.focus .top, .shell.focus .side{ display:none; }
  .shell.focus .main:not(.flush){ padding:12px; }
  .tab.focus-btn{ margin-left:auto; color:var(--seal); border:1.5px solid var(--seal); border-radius:10px; padding:4px 12px; margin-bottom:5px; font-size:13px; }
</style>
</head>
<body>
<div id="root"></div>
<dialog id="unitdlg"><form method="dialog"><h3 id="unit-t">複習單元</h3><label style="display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:4px 0 5px;">名稱</label><input type="text" id="unit-name" autocomplete="off" placeholder="例如：第一到六課複習"><label style="display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:12px 0 5px;">包含哪幾課（教材與活動會合併這幾課的生詞）</label><div id="unit-lessons" style="display:flex;flex-wrap:wrap;gap:8px;"></div><div class="row"><button type="button" class="btn" id="unit-no">取消</button><button type="submit" class="btn primary">儲存</button></div></form></dialog>

<script>
(function(){
"use strict";
var SESSION_KEY = "hanyu_mandamy_teacher_session"; // 跟教材頁、簡報頁共用，登入一次三邊都通
var PBKDF2_ITERATIONS = 100000;
var root = document.getElementById("root");
var params = new URLSearchParams(location.search);

// ---------- 小工具 ----------
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function uid(p){ return p + Math.random().toString(36).slice(2, 9); }
function toast(msg){ var t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2200); }
function askText(title, value, okLabel){
  return new Promise(function(resolve){
    var d = document.getElementById("ask"), i = document.getElementById("ask-i");
    document.getElementById("ask-t").textContent = title; i.value = value || "";
    document.getElementById("ask-ok").textContent = okLabel || "確定";
    var done = false;
    function fin(v){ if(done) return; done = true; try{ d.close(); }catch(e){} resolve(v); }
    document.getElementById("ask-no").onclick = function(){ fin(null); };
    d.oncancel = function(e){ e.preventDefault(); fin(null); };
    d.querySelector("form").onsubmit = function(e){ e.preventDefault(); var v = i.value.trim(); fin(v || null); };
    d.showModal(); setTimeout(function(){ i.focus(); i.select(); }, 30);
  });
}
function askChoice(title, groups, okLabel){
  // groups: [{ label, items: [{ v, t }] }]
  return new Promise(function(resolve){
    var d = document.getElementById("pick"), sel = document.getElementById("pick-s");
    document.getElementById("pick-t").textContent = title; document.getElementById("pick-ok").textContent = okLabel || "確定";
    sel.innerHTML = groups.map(function(g){ return '<optgroup label="' + esc(g.label) + '">' + g.items.map(function(it){ return '<option value="' + esc(it.v) + '">' + esc(it.t) + '</option>'; }).join("") + '</optgroup>'; }).join("");
    var done = false;
    function fin(v){ if(done) return; done = true; try{ d.close(); }catch(e){} resolve(v); }
    document.getElementById("pick-no").onclick = function(){ fin(null); };
    d.oncancel = function(e){ e.preventDefault(); fin(null); };
    d.querySelector("form").onsubmit = function(e){ e.preventDefault(); fin(sel.value || null); };
    d.showModal();
  });
}
function waitFirebase(){
  return new Promise(function(resolve){
    if(window.__firebaseReady || window.__firebaseFailed){ resolve(!!window.__firebaseReady); return; }
    var to = setTimeout(function(){ resolve(false); }, 15000);
    window.addEventListener("firebase-bridge-ready", function(){ clearTimeout(to); resolve(!!window.__firebaseReady); }, { once: true });
  });
}
async function fbGet(path){ var s = await window.get(window.ref(window.db, path)); return s.exists() ? s.val() : null; }
function fbSet(path, v){ return window.set(window.ref(window.db, path), v); }
function fbUpdate(path, v){ return window.update(window.ref(window.db, path), v); }
function hex(b){ return Array.prototype.map.call(b, function(x){ return x.toString(16).padStart(2, "0"); }).join(""); }
function unhex(h){ var b = new Uint8Array(h.length / 2); for(var i = 0; i < b.length; i++) b[i] = parseInt(h.substr(i * 2, 2), 16); return b; }
async function pbkdf2(pw, saltHex){
  var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), { name: "PBKDF2" }, false, ["deriveBits"]);
  var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: unhex(saltHex), iterations: PBKDF2_ITERATIONS, hash: "SHA-256" }, km, 256);
  return hex(new Uint8Array(bits));
}
function sanitizeUser(s){ return String(s || "").trim().toLowerCase().replace(/[^a-z0-9_]/g, ""); }
var CN = { "零":0,"〇":0,"一":1,"二":2,"兩":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9 };
function cnNum(s){
  s = String(s || "");
  if(/^\d+$/.test(s)) return Number(s);
  if(s === "十") return 10;
  var m = /^([一二兩三四五六七八九])?十([一二三四五六七八九])?$/.exec(s);
  if(m) return (m[1] ? CN[m[1]] : 1) * 10 + (m[2] ? CN[m[2]] : 0);
  if(s.length === 1 && CN[s] != null) return CN[s];
  return null;
}
function lessonFromTitle(t){ var m = /第\s*([0-9]+|[零〇一二兩三四五六七八九十]+)\s*課/.exec(t || ""); return m ? cnNum(m[1]) : null; }
var OPEN_KEYS = [["vocab","生詞"],["grammar","語法"],["text","課文"],["slides","投影片"],["quiz","測驗與練習"],["activities","活動"]];

// ---------- 狀態 ----------
var S = { focus: false, teacher: null, plat: { schools: {}, lessonMap: {}, lessons: {} }, sel: null, lesson: null, tab: null, sub: null, student: null, sideOpen: false };
function schoolsOf(){ return S.plat.schools || {}; }
function clsPath(sel){ return "teacherPlatform/" + S.teacher.id + "/schools/" + sel.s + "/terms/" + sel.t + "/classes/" + sel.c; }
function getSchool(y, sc){ var yr = schoolsOf()[y]; return yr && yr.terms ? yr.terms[sc] : null; }
function getCls(sel){ var sc = schoolsOf()[sel.s]; var tm = sc && sc.terms && sc.terms[sel.t]; return tm && tm.classes ? tm.classes[sel.c] : null; }
var DEFAULT_BOOK = "b1";
var DEFAULT_BOOK_TITLE = "《學華語向前走》第一冊";
function lkey(book, no){ return book === DEFAULT_BOOK ? String(no) : book + "~" + no; }
function parseKey(k){ k = String(k); if(k.indexOf("u_") === 0) return null; var i = k.indexOf("~"); return i < 0 ? { book: DEFAULT_BOOK, no: Number(k) } : { book: k.slice(0, i), no: Number(k.slice(i + 1)) }; }
function booksObj(){ var b = S.plat.books || {}; if(!b[DEFAULT_BOOK]) b = Object.assign({ b1: { title: DEFAULT_BOOK_TITLE, order: 0 } }, b); return b; }
function bookIds(){ var b = booksObj(); return Object.keys(b).sort(function(x, y){ return (b[x].order || 0) - (b[y].order || 0); }); }
function bookTitle(id){ var b = booksObj()[id]; return b ? b.title : "（已刪除的教材）"; }
function classBookIds(cls){ var all = bookIds(); if(!cls || !cls.books) return all; var sel = all.filter(function(b){ return cls.books[b]; }); return sel; }
function multiBooks(){ return bookIds().length > 1; }
function isUnit(no){ var l = (S.plat.lessons || {})[no]; return !!(l && l.unit); }
function lessonsOfBook(bid){
  var L = S.plat.lessons || {};
  return Object.keys(L).filter(function(k){ return !L[k].unit && (L[k].book || DEFAULT_BOOK) === bid; }).sort(function(a, b){ return L[a].no - L[b].no; });
}
function unitKeys(){ var L = S.plat.lessons || {}; return Object.keys(L).filter(function(k){ return L[k].unit; }).sort(function(a, b){ return (L[a].order || 0) - (L[b].order || 0); }); }
function lessonKeys(cls){
  var out = [];
  (cls ? classBookIds(cls) : bookIds()).forEach(function(b){ out = out.concat(lessonsOfBook(b)); });
  return out.concat(unitKeys());
}
function memberRange(m){
  var L = S.plat.lessons || {}, byBook = {};
  (m || []).forEach(function(k){ var pk = parseKey(k); if(!pk) return; (byBook[pk.book] = byBook[pk.book] || []).push(pk.no); });
  var bks = Object.keys(byBook);
  if(!bks.length) return "";
  if(bks.length > 1) return "跨 " + bks.length + " 本教材・共 " + (m || []).length + " 課";
  var arr = byBook[bks[0]].sort(function(a, b){ return a - b; });
  var contiguous = arr.every(function(x, i){ return i === 0 || x === arr[i - 1] + 1; });
  var txt = contiguous && arr.length > 1 ? "第 " + arr[0] + "–" + arr[arr.length - 1] + " 課" : "第 " + arr.join("、") + " 課";
  return (multiBooks() ? bookTitle(bks[0]) + " " : "") + txt;
}
function lessonTitle(key){
  var l = (S.plat.lessons || {})[key];
  if(l && l.unit) return "📚 複習：" + (l.title || "") + "（" + memberRange(l.members) + "）";
  var pk = parseKey(key) || { book: DEFAULT_BOOK, no: key };
  return (multiBooks() ? bookTitle(pk.book) + "　" : "") + "第 " + pk.no + " 課" + (l && l.title ? " " + l.title : "");
}
// 嵌入教材頁用的課次參數；目前只有預設教材（第一冊）有雲端生詞庫，其他教材回傳 null
function lessonParam(key){
  var l = (S.plat.lessons || {})[key];
  if(l && l.unit){ var nums = (l.members || []).map(parseKey).filter(function(pk){ return pk && pk.book === DEFAULT_BOOK; }).map(function(pk){ return pk.no; }); return nums.length ? "lessons=" + encodeURIComponent(nums.join(",")) : null; }
  var pk = parseKey(key); return pk && pk.book === DEFAULT_BOOK ? "lesson=" + encodeURIComponent(pk.no) : null;
}
function lessonCounts(no){
  var l = (S.plat.lessons || {})[no] || {}; var c = l.counts || {}, ps = l.projects || {}, sl = 0, qz = 0;
  Object.keys(ps).forEach(function(k){ sl += ps[k].slides || 0; qz += ps[k].quiz || 0; });
  return { vocab: c.vocab || 0, grammar: c.grammar || 0, text: c.text || 0, slides: sl, quiz: qz };
}
var BOOK_TOKEN = /第\s*([0-9零〇一二兩三四五六七八九十]+)\s*冊/;
function bookFromTitle(title){
  var m = BOOK_TOKEN.exec(title || ""); if(!m) return null;
  var ids = bookIds();
  for(var i = 0; i < ids.length; i++){ var bm = BOOK_TOKEN.exec(bookTitle(ids[i])); if(bm && cnNum(bm[1]) === cnNum(m[1])) return ids[i]; }
  return null;
}

// ---------- 登入（老師）----------
function viewLogin(msg){
  root.innerHTML = '<div class="center-wrap"><div class="card"><h2>曼米中文平台</h2><p class="sub">老師登入　Teacher login</p>' +
    '<label>帳號</label><input type="text" id="lu" autocomplete="username"><label>密碼</label><input type="password" id="lp" autocomplete="current-password" style="width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:var(--surface-2);">' +
    '<div class="err" id="le"></div><button class="btn primary" id="lgo" style="width:100%;margin-top:14px;padding:11px;">登入</button>' +
    '<p class="sub" style="margin-top:16px;">學生請使用老師給的班級連結，或 <a href="#" id="tostu">輸入班級代碼</a></p></div></div>';
  var le = document.getElementById("le"); if(msg){ le.textContent = msg; le.style.display = "block"; }
  document.getElementById("tostu").onclick = function(e){ e.preventDefault(); viewStudentEntry(); };
  async function go(){
    le.style.display = "none";
    var u = sanitizeUser(document.getElementById("lu").value), p = document.getElementById("lp").value;
    if(!u || !p){ le.textContent = "請輸入帳號與密碼"; le.style.display = "block"; return; }
    try{
      var acc = await fbGet("teacherAccounts/" + u);
      if(!acc){ le.textContent = "找不到這個帳號"; le.style.display = "block"; return; }
      if(acc.disabled){ le.textContent = "這個帳號已被停用"; le.style.display = "block"; return; }
      if((await pbkdf2(p, acc.saltHex)) !== acc.hashHex){ le.textContent = "密碼錯誤"; le.style.display = "block"; return; }
      try{ localStorage.setItem(SESSION_KEY, acc.id); }catch(e){}
      await startTeacher(acc);
    }catch(e){ le.textContent = "連線失敗，請檢查網路後再試"; le.style.display = "block"; }
  }
  document.getElementById("lgo").onclick = go;

}

// 層級改成「年度 › 學校 › 班級」：資料路徑不變（schools 這層現在放年度、terms 這層放學校），舊資料（學校›學期）自動轉過來，舊版先備份
async function migrateHier(){
  var base = "teacherPlatform/" + S.teacher.id;
  if(S.plat.hier === 2) return;
  var old = S.plat.schools || {}, hasOld = Object.keys(old).length > 0;
  if(hasOld){
    try{ await fbSet(base + "/schoolsBackupV1", old); }catch(e){ return; }
    var years = {}, byName = {};
    Object.keys(old).forEach(function(sid){
      var sc = old[sid], terms = sc.terms || {};
      Object.keys(terms).forEach(function(tid){
        var tm = terms[tid], yid = byName[tm.name];
        if(!yid){ yid = uid("y_"); byName[tm.name] = yid; years[yid] = { name: tm.name, order: tm.order || Date.now(), terms: {} }; }
        years[yid].terms[sid] = { name: sc.name, order: sc.order || 0, classes: tm.classes || {} };
      });
      // 沒有任何學期的學校：放進一個「未分年度」
      if(!Object.keys(terms).length){
        var yid2 = byName["未分年度"]; if(!yid2){ yid2 = uid("y_"); byName["未分年度"] = yid2; years[yid2] = { name: "未分年度", order: 0, terms: {} }; }
        years[yid2].terms[sid] = { name: sc.name, order: sc.order || 0, classes: {} };
      }
    });
    await fbSet(base + "/schools", years);
    var ys = Object.keys(years);
    for(var i = 0; i < ys.length; i++){ var sch = years[ys[i]].terms; for(var sk in sch){ var cl = sch[sk].classes || {}; for(var ck in cl){ if(cl[ck].code) try{ await fbSet("classCodes/" + cl[ck].code, { t: S.teacher.id, s: ys[i], tm: sk, c: ck }); }catch(e){} } } }
    S.plat.schools = years;
  }
  await fbSet(base + "/hier", 2); S.plat.hier = 2;
}

// 把「雲端生詞庫」跟「測驗庫」整理成一份輕量的課次索引（學生端只讀這一份，不必下載整個測驗庫）
async function syncLessonIndex(){
  var t = S.teacher.id, bank = null, lib = null;
  try{ bank = await fbGet("teacherVocabBanks/" + t); }catch(e){}
  try{ lib = await fbGet("teacherLibraries/" + t); }catch(e){}
  var lessons = {}, lm = S.plat.lessonMap || {};
  // 雲端生詞庫：沒有標「book」的課次都算預設教材（第一冊）
  if(bank && Array.isArray(bank.courseData)) bank.courseData.forEach(function(l){
    var b = l.book || DEFAULT_BOOK, k = lkey(b, l.lesson);
    lessons[k] = { book: b, no: Number(l.lesson), title: l.title || "", counts: { vocab: (l.vocab || []).length, grammar: (l.grammar || []).length, text: (l.texts || []).length }, projects: {} };
  });
  // 老師自己新增的課次（例如其他教材、還沒有生詞也想先建好的課）
  var cl = S.plat.customLessons || {};
  Object.keys(cl).forEach(function(k){ if(!booksObj()[cl[k].book]) return; if(!lessons[k]) lessons[k] = { book: cl[k].book, no: Number(cl[k].no), title: cl[k].title || "", counts: {}, projects: {} }; else if(!lessons[k].title && cl[k].title) lessons[k].title = cl[k].title; });
  // 複習單元：成員是課次的 key；生詞／語法／課文數量是成員的總和
  var units = S.plat.units || {};
  Object.keys(units).forEach(function(uk){
    var u = units[uk], c = { vocab: 0, grammar: 0, text: 0 }, mem = (u.lessons || []).map(String);
    mem.forEach(function(k){ var ll = lessons[k]; if(ll && ll.counts){ c.vocab += ll.counts.vocab || 0; c.grammar += ll.counts.grammar || 0; c.text += ll.counts.text || 0; } });
    lessons[uk] = { unit: true, title: u.title || "", members: mem, order: u.order || 0, counts: c, projects: {} };
  });
  var unassigned = {}, allProjects = {};
  if(lib && lib.projects) Object.keys(lib.projects).forEach(function(pid){
    var p = lib.projects[pid], key = lm[pid] == null ? null : String(lm[pid]);
    if(key == null){
      var guess = lessonFromTitle(p.title);
      if(guess != null){ var gb = bookFromTitle(p.title) || DEFAULT_BOOK; key = lkey(gb, guess); lm[pid] = key; }
    }
    var slides = 0, quiz = 0;
    Object.keys(p.sections || {}).forEach(function(sid){ var sc = p.sections[sid], n = Object.keys(sc.questions || {}).length; if(sc.type === "board") slides += n; else quiz += n; });
    allProjects[pid] = { title: p.title, slides: slides, quiz: quiz };
    if(key == null){ unassigned[pid] = { title: p.title, slides: slides, quiz: quiz }; return; }
    if(key.indexOf("u_") === 0 && !lessons[key]){ unassigned[pid] = { title: p.title, slides: slides, quiz: quiz }; return; } // 歸去的複習單元已被刪除
    if(!lessons[key]){
      var pk = parseKey(key);
      if(!pk || !booksObj()[pk.book]){ unassigned[pid] = { title: p.title, slides: slides, quiz: quiz }; return; }
      lessons[key] = { book: pk.book, no: pk.no, title: (p.title || "").replace(/^第\s*[0-9零〇一二兩三四五六七八九十]+\s*課\s*/, ""), counts: {}, projects: {} };
    }
    lessons[key].projects[pid] = { title: p.title, slides: slides, quiz: quiz };
  });
  S.plat.lessons = lessons; S.plat.lessonMap = lm; S.unassigned = unassigned; S.allProjects = allProjects;
  var base = "teacherPlatform/" + t;
  try{ await fbUpdate(base, { lessons: lessons, lessonMap: lm, books: booksObj() }); }catch(e){ console.error("寫入課次索引失敗（可能是 Firebase 規則還沒開放 teacherPlatform）", e); S.ruleErr = true; }
}

  var cur = tabs.filter(function(t){ return t[0] === S.tab; })[0];
  var live = S.live && S.live.on;
  var html = '<div class="tabs">' + (liveStudent ? '' : '<button class="tab" data-back="1">‹ 返回</button>' + tabs.map(function(t){ return '<button class="tab' + (t[0] === S.tab ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>'; }).join("") + (teacher ? '<!--copyto-->' : '') +
    (teacher ? ((live ? '<button class="tab focus-btn" data-fs="1" style="margin-left:auto;" title="瀏覽器全螢幕（Esc 退出，不會結束上課）">⛶ 全螢幕</button><button class="tab focus-btn" data-focus="1" style="margin-left:6px;">' + (S.focus ? "顯示欄位" : "隱藏欄位") + '</button><button class="tab focus-btn" data-live="1" style="margin-left:6px;background:var(--seal);color:#fff;">⏹ 結束上課</button>' : '<button class="tab focus-btn" data-live="1" title="開始上課：學生會自動跟著你的畫面，並隱藏上方與左側欄位">🎬 開始上課</button>')) : '')) + '</div>';
  var sub = '', frame = '', role = teacher ? '' : '&role=student';
  if(S.tab === "material"){
    var subs = [["vocab","生詞"],["grammar","語法"],["text","課文"]].filter(function(s){ return teacher || open[s[0]]; });
    if(liveStudent && S.sub && subs.some(function(s){ return s[0] === S.sub; })) subs = subs.filter(function(s){ return s[0] === S.sub; });
    if(!S.sub || !subs.some(function(s){ return s[0] === S.sub; })) S.sub = subs[0][0];
    sub = liveStudent ? '' : '<div class="subbar">' + subs.map(function(s){ return '<button class="tab' + (s[0] === S.sub ? ' on' : '') + '" data-sub="' + s[0] + '" style="padding:5px 14px;font-size:13.5px;">' + s[1] + '</button>'; }).join("") + (teacher && parseKey(no) ? '<button class="tab" data-editlib="1" style="padding:5px 14px;font-size:13.5px;margin-left:auto;">編輯這一課教材</button>' : '') + '</div>';
    var lp = lessonParam(no);
    frame = lp ? lessonHtmlFrame("index.html?embed=1&" + lp + "&tab=" + S.sub + role) : '<div class="empty"><p class="note">這本教材還沒有生詞庫，所以這裡暫時沒有內容。<br>之後會開放你新增自己的教材內容。</p></div>';
  } else if(S.tab === "activities"){
    var lp2 = lessonParam(no);
    frame = lp2 ? lessonHtmlFrame("index.html?embed=1&" + lp2 + "&tab=activities" + role) : '<div class="empty"><p class="note">這本教材還沒有生詞庫，所以活動暫時沒有可用的生詞。</p></div>';
  } else {
    var ps = ((S.plat.lessons || {})[no] || {}).projects || {}, pids = Object.keys(ps);
    var kind = S.tab === "slides" ? "slides" : "quiz";
    if(!teacher) pids = pids.filter(function(p){ return (ps[p][kind] || 0) > 0; });
    if(teacher){
      if(!pids.length){
        if(S.creating === no) frame = lessonHtmlFrame("slides/practice.html?embed=1&newproject=" + encodeURIComponent(lessonTitle(no)) + "&focus=" + kind);
        else frame = '<div class="empty"><h3 style="margin-bottom:8px;">' + lessonTitle(no) + '</h3><p class="note" style="margin-bottom:12px;">這一課還沒有' + (kind === "slides" ? "投影片" : "測驗與練習") + '。</p><button class="btn" id="mkproj">＋ 為這一課建立' + (kind === "slides" ? "投影片" : "測驗與練習") + '</button></div>';
      } else {
        if(!S.sub || pids.indexOf(S.sub) === -1) S.sub = pids[0];
        sub = '<div class="subbar">' + (pids.length > 1 ? pids.map(function(p){ return '<button class="tab' + (p === S.sub ? ' on' : '') + '" data-sub="' + p + '" style="padding:5px 14px;font-size:13.5px;">' + esc(ps[p].title) + '</button>'; }).join("") : '') + '</div>';
        if(pids.length === 1) sub = '';
        html = html.replace('<!--copyto-->', '<button class="tab" data-copyto="' + kind + '">複製到其他課…</button>');
        frame = lessonHtmlFrame("slides/practice.html?embed=1&project=" + encodeURIComponent(S.sub) + "&focus=" + kind + ((S.live && S.live.on && S.live.room && S.live.roomProject === S.sub) ? "&room=" + encodeURIComponent(S.live.room) : ""));
      }
    } else if(liveStudent){
      frame = (S.live && S.live.room) ? lessonHtmlFrame("slides/practice.html?embed=1&room=" + encodeURIComponent(S.live.room) + "&role=student&name=" + encodeURIComponent(S.student ? S.student.name : "")) : '<div class="empty"><p class="note">老師還沒開始這一段，請稍候…</p></div>';
    } else {
      frame = '<div class="empty"><h3 style="margin-bottom:8px;">' + (kind === "slides" ? "投影片" : "測驗與練習") + '</h3><p class="note">上課時，老師會給你一組房間號碼。<br>輸入後就能和老師一起看投影片、作答。</p><div class="join" style="justify-content:center;"><input type="text" id="roomno" placeholder="房間號碼" inputmode="numeric" style="width:160px;"><button class="btn primary" id="roomgo">加入</button></div></div>';
    }
  }
  return { html: html + sub + frame, tabs: tabs };
}
// ---------- 上課（老師開始上課，學生跟著老師的畫面）----------
function liveRef(){ return clsPath(S.sel) + "/live"; }
async function toggleLive(){
  var cls = getCls(S.sel); if(!cls) return;
  if(S.live && S.live.on){
    if(!confirm("結束上課？學生會回到自己的班級頁。")) return;
    S.live = null; cls.live = null; try{ await fbSet(liveRef(), null); }catch(e){}
    setFocus(false); try{ if(document.fullscreenElement) document.exitFullscreen().catch(function(){}); }catch(e){} renderLesson(cls); return;
  }
  S.live = { on: true, lesson: S.lesson, tab: S.tab, sub: S.sub || null, room: null, startedAt: Date.now() };
  try{ await fbSet(liveRef(), S.live); }catch(e){ toast("開始上課失敗，請檢查網路或 Firebase 規則"); S.live = null; return; }
  cls.live = S.live;
  renderLesson(cls); setFocus(true); toggleBrowserFullscreenOn(); toast("已開始上課，學生會自動跟著你的畫面");
}
// 老師上課中、在簡報／測驗分頁：自動幫老師開房間（學生就會自動進來），並跳到這個分頁對應的第一份簡報／第一題
var liveRoomTimer = null;
function wireLiveRoom(){
  if(liveRoomTimer){ clearInterval(liveRoomTimer); liveRoomTimer = null; }
  if(!S.live || !S.live.on || (S.tab !== "slides" && S.tab !== "quiz")) return;
  var tries = 0, jumped = false, kind = S.tab === "slides" ? "slides" : "quiz", sub = S.sub;
  liveRoomTimer = setInterval(function(){
    var fr = document.getElementById("fr");
    if(!fr || !fr.contentWindow || S.sub !== sub || !S.live || !S.live.on || ++tries > 14){ clearInterval(liveRoomTimer); liveRoomTimer = null; return; }
    if(S.live.room && S.live.roomProject === S.sub){
      if(!jumped && tries >= 3){ fr.contentWindow.postMessage({ mm: "focusKind", kind: kind }, "*"); jumped = true; }
      if(jumped){ clearInterval(liveRoomTimer); liveRoomTimer = null; }
    } else if(tries >= 2){
      fr.contentWindow.postMessage({ mm: "startRoom" }, "*");
    }
  }, 900);
}
function pushLive(clearLesson){
  if(!S.teacher || !S.live || !S.live.on || !S.sel) return;
  var patch = clearLesson ? { lesson: null, tab: null, sub: null, room: null } : { lesson: S.lesson || null, tab: S.tab || null, sub: S.sub || null };
  Object.keys(patch).forEach(function(k){ S.live[k] = patch[k]; });
  fbUpdate(liveRef(), patch).catch(function(){});
}
// 把這一課目前的投影片（或測驗與練習）複製成另一課的新專案；由內嵌編輯器動手（它手上有最新的資料庫內容，避免之後被它覆蓋掉）
async function copyToLesson(kind){
  var cls = getCls(S.sel), keys = lessonKeys(cls).filter(function(k){ return k !== S.lesson; });
  if(!keys.length){ toast("沒有其他課次可以複製過去"); return; }
  var groups = [], byBook = {};
  keys.forEach(function(k){ var pk = parseKey(k); var g = pk ? bookTitle(pk.book) : "複習單元"; (byBook[g] = byBook[g] || []).push({ v: k, t: lessonTitle(k) }); });
  Object.keys(byBook).forEach(function(g){ groups.push({ label: g, items: byBook[g] }); });
  var target = await askChoice("把這一課的" + (kind === "slides" ? "投影片" : "測驗與練習") + "複製到：", groups, "複製");
  if(!target) return;
  var fr = document.getElementById("fr"); if(!fr || !fr.contentWindow){ toast("編輯器還沒載入"); return; }
  S.copyTarget = target;
  fr.contentWindow.postMessage({ mm: "copyTo", kind: kind, title: lessonTitle(target), target: target }, "*");
}
window.addEventListener("message", function(e){
  if(!S.teacher || !e.data || e.data.mm !== "projectCopied") return;
  var d = e.data, key = d.target;
  S.plat.lessonMap[d.pid] = key; fbSet("teacherPlatform/" + S.teacher.id + "/lessonMap/" + d.pid, key).catch(function(){});
  var l = S.plat.lessons[key]; if(l){ l.projects = l.projects || {}; l.projects[d.pid] = { title: d.title, slides: d.slides || 0, quiz: d.quiz || 0 }; }
  toast("已複製到「" + lessonTitle(key) + "」");
});
// 教材庫（iframe）儲存後：重新整理課次索引
window.addEventListener("message", function(e){
  if(!S.teacher || !e.data || e.data.mm !== "bankSaved") return;
  syncLessonIndex().then(function(){ toast("教材已更新"); }).catch(function(){});
});
// 簡報頁（iframe）為這一課建好專案：歸到這一課（不重新載入 iframe，編輯器繼續用）
window.addEventListener("message", function(e){
  if(!S.teacher || !e.data || e.data.mm !== "projectCreated" || !S.lesson) return;
  var pid = e.data.pid, key = S.lesson;
  S.plat.lessonMap[pid] = key; fbSet("teacherPlatform/" + S.teacher.id + "/lessonMap/" + pid, key).catch(function(){});
  var l = S.plat.lessons[key]; if(l){ l.projects = l.projects || {}; l.projects[pid] = { title: e.data.title, slides: 0, quiz: 0 }; }
  S.sub = pid; S.creating = null;
});
// 簡報頁（iframe）裡老師開了房間：通知學生跟著進房
window.addEventListener("message", function(e){
  if(!S.teacher || !e.data || e.data.mm !== "room" || !S.live || !S.live.on) return;
  S.live.room = e.data.id || null; S.live.roomProject = S.live.room ? S.sub : null; fbUpdate(liveRef(), { room: S.live.room }).catch(function(){});
});
function setFocus(on){
  S.focus = !!on;
  var sh = document.querySelector(".shell"); if(sh) sh.classList.toggle("focus", S.focus);
  var fb = document.querySelector("[data-focus]"); if(fb) fb.textContent = S.focus ? "顯示欄位" : "隱藏欄位";
  var fr = document.getElementById("fr"); if(fr && fr.contentWindow) fr.contentWindow.postMessage({ mm: "focus", on: S.focus }, "*");
}
// 退出瀏覽器全螢幕（Esc 或老師自己切出去看別的東西）不會結束上課，也不會改變欄位隱藏與否——只有按鈕才會改變
function toggleBrowserFullscreenOn(){ try{ if(!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){}); }catch(e){} }
function toggleBrowserFullscreen(){
  try{
    if(document.fullscreenElement){ document.exitFullscreen().catch(function(){}); }
    else if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen().catch(function(){}); }
  }catch(e){}
}
function bindLessonNav(cls, backFn, renderFn){
  var m = document.getElementById("main");
  m.onclick = function(e){
    var b = e.target.closest("button"); if(!b) return;
    if(b.dataset.back){ if(S.focus) setFocus(false); backFn(); if(S.teacher) pushLive(true); return; }
    if(b.dataset.focus){ setFocus(!S.focus); return; }
    if(b.dataset.live){ toggleLive(); return; }
    if(b.dataset.fs){ toggleBrowserFullscreen(); return; }
    if(b.dataset.copyto){ copyToLesson(b.dataset.copyto); return; }
    if(b.dataset.editlib){ var pk0 = parseKey(S.lesson); if(pk0){ S.lib = { book: pk0.book, lesson: pk0.no }; render(); } return; }
    if(b.id === "mkproj"){ S.creating = S.lesson; renderFn(); return; }
    if(b.dataset.tab){ S.tab = b.dataset.tab; S.sub = null; renderFn(); pushLive(); return; }
    if(b.dataset.sub){ S.sub = b.dataset.sub; renderFn(); pushLive(); return; }
    if(b.id === "roomgo"){
      var v = (document.getElementById("roomno").value || "").replace(/\D/g, "");
      if(!v){ toast("請輸入房間號碼"); return; }
      location.href = "slides/practice.html?room=" + v + "&role=student&name=" + encodeURIComponent(S.student ? S.student.name : "");
    }
  };
}
function renderLesson(cls){
  var no = S.lesson, open = (cls.lessonOpen || {})[no] || {};
  var r = renderLessonCommon(no, open, true);
  shell(r.html, { flush: true });
  setCrumb([schoolsOf()[S.sel.s].name, schoolsOf()[S.sel.s].terms[S.sel.t].name, cls.name, lessonTitle(no)]);
  saveHash();
  bindLessonNav(cls, function(){ S.lesson = null; S.tab = null; S.sub = null; render(); }, function(){ renderLesson(cls); });
  wireLiveRoom();
}

// ---------- 學生 ----------
function viewStudentEntry(msg, codeIn){
  var saved = ""; try{ saved = localStorage.getItem("mm_student_name") || ""; }catch(e){}
  root.innerHTML = '<div class="center-wrap"><div class="card"><h2>曼米中文</h2><p class="sub">學生入口</p>' +
    '<label>班級代碼</label><input type="text" id="sc" value="' + esc(codeIn || "") + '" style="text-transform:uppercase;letter-spacing:.15em;" autocomplete="off">' +
    '<label>你的名字</label><input type="text" id="sn" value="' + esc(saved) + '" autocomplete="off">' +
    '<div class="err" id="se"></div><button class="btn primary" id="sgo" style="width:100%;margin-top:14px;padding:11px;">進入班級</button>' +
    '<p class="sub" style="margin-top:16px;"><a href="#" id="tot">老師登入</a></p></div></div>';
  var se = document.getElementById("se"); if(msg){ se.textContent = msg; se.style.display = "block"; }
  document.getElementById("tot").onclick = function(e){ e.preventDefault(); history.replaceState(null, "", location.pathname); viewLogin(); };
  async function go(){
    se.style.display = "none";
    var code = document.getElementById("sc").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, ""), name = document.getElementById("sn").value.trim();
    if(!code || !name){ se.textContent = "請輸入班級代碼和名字"; se.style.display = "block"; return; }
    try{ localStorage.setItem("mm_student_name", name); }catch(e){}
    await startStudent(code, name);
  }
  document.getElementById("sgo").onclick = go;
  document.getElementById("sn").addEventListener("keydown", function(e){ if(e.key === "Enter") go(); });
}
async function startStudent(code, name){
  root.innerHTML = '<div class="center-wrap"><div class="note">載入中…</div></div>';
  try{
    var idx = await fbGet("classCodes/" + code);
    if(!idx){ viewStudentEntry("找不到這個班級代碼，請向老師確認。", code); return; }
    var base = "teacherPlatform/" + idx.t;
    var res = await Promise.all([fbGet(base + "/schools/" + idx.s + "/name"), fbGet(base + "/schools/" + idx.s + "/terms/" + idx.tm + "/name"), fbGet(base + "/schools/" + idx.s + "/terms/" + idx.tm + "/classes/" + idx.c), fbGet(base + "/lessons"), fbGet(base + "/books")]);
    if(!res[2]){ viewStudentEntry("這個班級已不存在。", code); return; }
    S.student = { name: name, code: code, idx: idx, school: res[0], term: res[1], cls: res[2] };
    S.live = res[2].live && res[2].live.on ? res[2].live : null;
    try{ window.onValue(window.ref(window.db, base + "/schools/" + idx.s + "/terms/" + idx.tm + "/classes/" + idx.c + "/live"), function(snap){ var v = snap.val(); var nv = v && v.on ? v : null; var key = JSON.stringify(nv); if(key === S.liveKey) return; S.liveKey = key; S.live = nv; S.liveRendered = null; if(S.student) renderStudent(); }); }catch(e){}
    S.plat = { lessons: res[3] || {}, books: res[4] || {} };
    S.lesson = null; S.tab = null; S.sub = null;
    var h = new URLSearchParams(location.hash.replace(/^#/, "")); if(h.get("l")) S.lesson = h.get("l"); if(h.get("tab")) S.tab = h.get("tab");
    renderStudent();
  }catch(e){ viewStudentEntry("連線失敗，請檢查網路後再試。", code); }
}
function renderStudent(){
  var st = S.student;
  if(S.live && S.live.on) return renderStudentLive();
  S.focus = false; S.liveRendered = null;
  var cls = st.cls, openMap = cls.lessonOpen || {};
  history.replaceState(null, "", location.pathname + "?class=" + st.code + (S.lesson ? "#l=" + S.lesson + (S.tab ? "&tab=" + S.tab : "") : ""));
  if(S.lesson && openMap[S.lesson]){
    var r = renderLessonCommon(S.lesson, openMap[S.lesson], false);
    shell(r.html, { flush: true }); setCrumb([st.school, st.term, cls.name, lessonTitle(S.lesson)]);
    bindLessonNav(cls, function(){ S.lesson = null; S.tab = null; S.sub = null; renderStudent(); }, renderStudent);
    return;
  }
  S.lesson = null;
  var keys = lessonKeys(cls).filter(function(no){ var o = openMap[no]; return o && OPEN_KEYS.some(function(k){ return o[k[0]]; }); });
  var html = '<div class="head-row"><div><div class="note">' + esc(st.school) + '　›　' + esc(st.term) + '</div><h2>' + esc(cls.name) + '</h2></div></div>';
  if(!keys.length) html += '<div class="empty"><p class="note">老師還沒有開放任何課次。<br>上課時請輸入老師給的房間號碼：</p><div class="join" style="justify-content:center;"><input type="text" id="roomno" placeholder="房間號碼" inputmode="numeric" style="width:160px;"><button class="btn primary" id="roomgo">加入</button></div></div>';
  else {
    html += '<div id="ls"></div><div class="panel"><h3>上課中？</h3><div class="join" style="margin:0;"><input type="text" id="roomno" placeholder="老師給的房間號碼" inputmode="numeric" style="width:200px;"><button class="btn primary" id="roomgo">加入房間</button></div></div>';
  }
  shell(html); setCrumb([st.school, st.term, cls.name]);
  var ls = document.getElementById("ls");
  keys.forEach(function(no){
    var o = openMap[no], d = document.createElement("div"); d.className = "lesson";
    d.innerHTML = '<div class="lh"><div class="lt">' + esc(lessonTitle(no)) + '</div><button class="btn primary sm">進入 ›</button></div><div class="toggles" style="margin-top:8px;">' + OPEN_KEYS.filter(function(k){ return o[k[0]]; }).map(function(k){ return '<span class="chip">' + k[1] + '</span>'; }).join("") + '</div>';
    d.querySelector("button").onclick = function(){ S.lesson = String(no); S.tab = null; S.sub = null; renderStudent(); };
    ls.appendChild(d);
  });
  var rg = document.getElementById("roomgo");
  if(rg) rg.onclick = function(){ var v = (document.getElementById("roomno").value || "").replace(/\D/g, ""); if(!v){ toast("請輸入房間號碼"); return; } location.href = "slides/practice.html?room=" + v + "&role=student&name=" + encodeURIComponent(st.name); };
}

// 老師開始上課：學生沒有選擇權，畫面完全跟著老師（哪一課、哪個分頁、簡報房間）
function renderStudentLive(){
  var live = S.live;
  S.focus = true;
  var key = [live.lesson, live.tab, live.sub, live.room].join("|");
  if(S.liveRendered === key && document.getElementById("main")) return;
  S.liveRendered = key;
  if(!live.lesson){
    shell('<div class="empty"><h2 style="margin-bottom:8px;">老師準備中</h2><p class="note">課程馬上開始，請稍候…</p></div>');
    return;
  }
  S.lesson = String(live.lesson); S.tab = live.tab; S.sub = live.sub;
  var all = { vocab: 1, grammar: 1, text: 1, slides: 1, quiz: 1, activities: 1 };
  var r = renderLessonCommon(S.lesson, all, false, true);
  shell(r.html, { flush: true });
}
// ---------- 啟動 ----------
(async function boot(){
  root.innerHTML = '<div class="center-wrap"><div class="note">連線中…</div></div>';
  var ok = await waitFirebase();
  if(!ok){ root.innerHTML = '<div class="center-wrap"><div class="card"><h2>無法連線</h2><p class="sub">請檢查網路連線後重新整理。</p><button class="btn primary" style="width:100%" onclick="location.reload()">重試</button></div></div>'; return; }
  var code = (params.get("class") || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
  if(code){
    var saved = ""; try{ saved = localStorage.getItem("mm_student_name") || ""; }catch(e){}
    var qn = params.get("name"); var nm = qn || saved;
    if(nm){ await startStudent(code, nm); } else viewStudentEntry("", code);
    return;
  }
  var sid = null; try{ sid = localStorage.getItem(SESSION_KEY); }catch(e){}
  if(sid){
    try{
      var acc = await fbGet("teacherAccounts/" + sid);
      if(acc && !acc.disabled){ await startTeacher(acc); return; }
    }catch(e){}
  }
  viewLogin();
})();
})();
</script>
