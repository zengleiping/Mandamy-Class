<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>曼米中文平台</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap">
<style>
  :root{ --paper:#FAF7F2; --surface:#fff; --surface-2:#F2EAE0; --ink:#2B2320; --ink-soft:#6B5F55; --line:rgba(43,35,32,.12); --seal:#E8825A; --seal-soft:#FBE8DE; --bamboo:#4C8577; --bamboo-soft:#E3F0EC; --shadow:0 8px 24px -10px rgba(28,33,30,.18); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  #root{ height:100%; }
  a.btn{ text-decoration:none; color:var(--ink); display:inline-block; }
  body{ background:var(--paper); color:var(--ink); font-family:"Plus Jakarta Sans","Noto Sans TC",-apple-system,sans-serif; -webkit-tap-highlight-color:transparent; }
  h1,h2,h3{ font-family:"LXGW WenKai TC","Noto Serif TC",serif; margin:0; }
  button{ font:inherit; color:inherit; cursor:pointer; }
  .btn{ border:1.5px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 14px; font-weight:700; font-size:13.5px; }
  .btn:hover{ border-color:var(--seal); color:var(--seal); }
  .btn.primary{ background:var(--seal); border-color:var(--seal); color:#fff; }
  .btn.primary:hover{ filter:brightness(1.07); color:#fff; }
  .btn.sm{ padding:5px 10px; font-size:12.5px; border-radius:8px; }
  .btn.danger{ color:#C0392B; }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); }
  input[type=text], input[type=password]{ width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; font-size:15px; background:var(--surface-2); color:var(--ink); }
  .center-wrap{ min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ background:var(--surface); border:1.5px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:26px; width:min(420px,100%); }
  .card h2{ font-size:21px; margin-bottom:6px; text-align:center; }
  .card .sub{ text-align:center; color:var(--ink-soft); font-size:13px; margin:0 0 16px; }
  .card label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:12px 0 5px; }
  .err{ background:var(--seal-soft); color:#B23B32; border-radius:10px; padding:8px 12px; font-size:13px; margin-top:10px; display:none; }
  .shell{ display:flex; flex-direction:column; height:100%; }
  .top{ display:flex; align-items:center; gap:12px; padding:8px 16px; background:var(--surface); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .brand{ font-family:"LXGW WenKai TC",serif; font-size:19px; font-weight:700; letter-spacing:.04em; }
  .brand small{ font-family:"Plus Jakarta Sans",sans-serif; font-size:11.5px; color:var(--ink-soft); margin-left:6px; letter-spacing:0; }
  .top .grow{ flex:1; }
  .crumb{ font-size:13px; color:var(--ink-soft); font-weight:600; }
  .body{ flex:1; min-height:0; display:flex; }
  .side{ width:270px; flex:none; background:var(--surface); border-right:1px solid var(--line); overflow-y:auto; padding:12px; }
  .side h3{ font-size:13px; color:var(--ink-soft); margin:2px 0 8px; font-family:inherit; }
  .tree-school{ margin-bottom:8px; }
  .tree-row{ display:flex; align-items:center; gap:4px; padding:5px 6px; border-radius:8px; font-size:13.5px; font-weight:700; }
  .tree-row.school{ background:var(--surface-2); }
  .tree-row.term{ margin-left:12px; color:var(--ink-soft); font-size:13px; }
  .tree-row.cls{ margin-left:26px; cursor:pointer; font-weight:600; }
  .tree-row.cls:hover{ background:var(--seal-soft); }
  .tree-row.cls.on{ background:var(--seal); color:#fff; }
  .tree-row .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tree-row .mini{ border:none; background:transparent; font-size:12px; padding:2px 5px; border-radius:6px; opacity:.6; }
  .tree-row .mini:hover{ opacity:1; background:rgba(0,0,0,.07); }
  .main{ flex:1; min-width:0; overflow-y:auto; padding:18px clamp(12px,3vw,32px); }
  .main.flush{ padding:0; display:flex; flex-direction:column; overflow:hidden; }
  .empty{ text-align:center; color:var(--ink-soft); padding:60px 20px; }

  .code{ font-family:ui-monospace,monospace; letter-spacing:.12em; font-size:15px; font-weight:800; color:var(--seal); }
  .panel{ background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:16px; }
  .panel h3{ font-size:16px; margin-bottom:10px; }
  .tools{ display:flex; gap:8px; flex-wrap:wrap; }

  .lesson .lh{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .lesson .counts{ font-size:12.5px; color:var(--ink-soft); margin:4px 0 10px; }
  .toggles{ display:flex; gap:6px; flex-wrap:wrap; }

  .tg.on{ background:var(--bamboo); border-color:var(--bamboo); color:#fff; }
  .tg.na{ opacity:.4; cursor:default; }

  .ctab.on{ color:var(--seal); border-bottom-color:var(--seal); }

  .tl-row .lt{ font-family:"LXGW WenKai TC",serif; font-size:17px; font-weight:700; }
  .tl-row.s-cur{ border-color:var(--seal); box-shadow:0 0 0 3px rgba(232,128,90,.15); }
  .tl-row.s-done{ background:var(--surface-2); }

  .tl-dot{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; flex:none; background:var(--surface-2); border:2px solid var(--line); }
  .s-done .tl-dot{ background:var(--bamboo); border-color:var(--bamboo); color:#fff; }
  .s-cur .tl-dot{ background:var(--seal); border-color:var(--seal); color:#fff; }
  .tl-main{ flex:1; min-width:200px; }
  .tl-act{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .lib-wrap{ display:flex; flex:1; min-height:0; overflow:hidden; }
  .lib-nav{ width:250px; flex:none; overflow:auto; padding:12px 10px; border-right:1px solid var(--line); background:var(--surface); }
  .lib-it{ display:block; width:100%; text-align:left; border:1.5px solid transparent; background:none; border-radius:12px; padding:8px 10px; margin-bottom:4px; font:inherit; font-size:14px; cursor:pointer; color:var(--ink); }
  .lib-it .note{ display:block; font-size:12px; margin-top:2px; }
  .lib-it:hover{ background:var(--surface-2); }
  .lib-it.on{ background:#FBE3D6; border-color:var(--seal); }
  .lib-sep{ font-size:12px; font-weight:700; color:var(--ink-soft); margin:12px 6px 6px; border-top:1px solid var(--line); padding-top:8px; }
  .lib-sep:empty{ padding-top:4px; }
  .lib-pane{ flex:1; min-width:0; overflow:auto; padding:16px 20px; }
  @media (max-width:760px){ .lib-wrap{ flex-direction:column; overflow:auto; } .lib-nav{ width:auto; border-right:none; border-bottom:1px solid var(--line); max-height:none; } .lib-pane{ overflow:visible; } }
  .hc-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; }
  .hc{ display:flex; flex-direction:column; gap:2px; text-align:left; border:1.5px solid var(--line); background:var(--surface-2); border-radius:14px; padding:10px 12px; font:inherit; cursor:pointer; color:var(--ink); }
  .hc b{ font-size:16px; font-family:"LXGW WenKai TC",serif; }
  .hc:hover{ border-color:var(--seal); background:#FBE3D6; }
  .gbar{ height:5px; background:var(--surface-2); border-radius:3px; margin-top:3px; min-width:60px; } .gbar div{ height:100%; background:var(--bamboo); border-radius:3px; }
  .tabs{ display:flex; gap:4px; padding:8px 14px 0; background:var(--surface); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tab{ border:none; background:none; padding:9px 16px; font-size:14.5px; font-weight:700; color:var(--ink-soft); border-bottom:3px solid transparent; }
  .tab.on{ color:var(--seal); border-bottom-color:var(--seal); }
  .subbar{ display:flex; gap:6px; padding:8px 14px; flex-wrap:wrap; align-items:center; background:var(--paper); border-bottom:1px solid var(--line); }
  .frame{ flex:1; width:100%; border:0; background:var(--paper); min-height:0; }
  .note{ color:var(--ink-soft); font-size:13px; line-height:1.7; }
  .join{ display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  dialog{ border:none; border-radius:16px; padding:0; box-shadow:0 20px 40px rgba(0,0,0,.25); width:min(380px,92vw); }
  dialog::backdrop{ background:rgba(20,20,18,.5); }
  dialog form{ padding:20px; }
  dialog h3{ font-size:17px; margin-bottom:10px; }
  dialog .row{ display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .cal-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
  .cal-w{ text-align:center; font-size:12px; font-weight:700; color:var(--ink-soft); padding:2px 0; }
  .cal-d{ min-height:84px; background:var(--surface-2); border-radius:10px; padding:5px 6px; cursor:pointer; overflow:hidden; }
  .cal-d:hover{ outline:2px solid var(--seal); }
  .cal-d.empty{ background:transparent; cursor:default; } .cal-d.empty:hover{ outline:none; }
  .cal-d.today{ background:#F6DCCF; }
  .cal-n{ font-weight:700; font-size:13px; margin-bottom:2px; }
  .bingo-root{ flex:1; min-height:0; overflow:auto; background:var(--paper); }
  .bg-wrap{ padding:16px; max-width:900px; margin:0 auto; }
  /* 電腦版：賓果盤整個塞進一個螢幕，不用捲動（格子隨可用高度伸縮，不再強制正方形） */
  @media (min-width:900px) and (min-height:560px){
    .bingo-root{ overflow:auto; display:flex; flex-direction:column; }
    .bg-wrap:not(.play){ flex:none; width:100%; }
    .bg-wrap.play{ flex:1; min-height:0; width:100%; max-width:1200px; padding:8px 20px 10px; display:flex; flex-direction:column; }
    .bg-wrap.play .head-row{ margin-bottom:4px; flex-wrap:nowrap; align-items:center; } .bg-wrap.play .head-row h2{ font-size:20px; margin:0; }
    .bg-wrap.play .bg-call{ margin:4px 0; padding:6px 10px; flex:none; } .bg-wrap.play .bg-callw{ font-size:clamp(28px,6vh,52px); line-height:1.1; }
    .bg-wrap.play .bg-turn,.bg-wrap.play .bg-me,.bg-wrap.play .bg-pend,.bg-wrap.play .bg-count{ margin:3px 0; font-size:15px; padding:4px; flex:none; }
    .bg-wrap.play .tools{ margin-bottom:4px !important; flex:none; }
    .bg-wrap.play .bg-grid{ flex:1; min-height:0; max-width:none; width:100%; margin:4px 0; grid-auto-rows:1fr; gap:8px; }
    .bg-wrap.play .bg-cell{ aspect-ratio:auto; min-height:0; }
    .bg-wrap.play .bg-w{ font-size:clamp(16px,3.4vh,34px); } .bg-wrap.play .bg-p{ font-size:clamp(11px,2vh,18px); }
    .bg-wrap.play .panel{ flex:none; margin:2px 0; padding:6px 12px; } .bg-wrap.play .panel h3{ display:none; }
    .bg-wrap.play .bg-order{ flex:none; }
  }
  .bg-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; max-width:680px; margin:10px auto; }
  .bg-grid.small{ max-width:520px; gap:5px; }
  .bg-cell{ aspect-ratio:1/1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:var(--surface); border:2px solid var(--line); border-radius:12px; padding:4px; overflow:hidden; word-break:break-all; transition:transform .1s; }
  .bg-cell.tap{ cursor:pointer; border-color:var(--seal); }
  .bg-cell.tap:hover{ transform:scale(1.04); }
  .bg-cell.pend{ outline:4px solid #E8B04A; }
  .bg-cell.empty{ background:var(--surface-2); }
  .bg-w{ font-weight:700; font-size:clamp(14px,2.6vw,26px); line-height:1.2; }
  .bg-p{ font-size:clamp(10px,1.6vw,15px); opacity:.85; }
  .bg-grid.small .bg-w{ font-size:15px; } .bg-grid.small .bg-p{ font-size:11px; }
  .bg-chip{ display:inline-block; color:#fff; font-weight:700; padding:3px 12px; border-radius:99px; margin:2px; }
  .bg-chip.now{ outline:3px solid var(--ink); }
  .bg-turn,.bg-me,.bg-pend,.bg-count{ margin:8px 0; font-size:16px; }
  .bg-turn{ font-size:20px; text-align:center; }
  .bg-count.bad{ color:#B23B32; font-weight:700; }
  .bg-pend{ text-align:center; padding:10px; background:#FBEBC8; border-radius:12px; font-size:18px; }
  .bg-order,.bg-score,.bg-picks{ display:flex; flex-wrap:wrap; gap:4px; }
  .bg-opts{ display:flex; flex-wrap:wrap; gap:10px; }
  .bg-opt{ flex:1 1 260px; display:flex; flex-direction:column; gap:4px; padding:10px 12px; border:1.5px solid var(--line); border-radius:12px; cursor:pointer; background:var(--surface); }
  .bg-opt input{ margin-right:6px; }
  .bg-chk{ display:flex; align-items:center; gap:6px; margin:4px 0; }
  .bg-lessons{ max-height:200px; overflow:auto; border:1px solid var(--line); border-radius:10px; padding:6px 10px; background:var(--surface); }
  .bg-pick{ border:2px solid var(--line); background:var(--surface); border-radius:99px; padding:5px 14px; cursor:pointer; font:inherit; }
  .bg-pick.sel{ background:var(--seal); color:#fff; border-color:var(--seal); }
  .bg-call{ text-align:center; padding:12px; background:var(--surface); border-radius:14px; border:1.5px solid var(--line); margin:8px 0; }
  .bg-callw{ font-size:clamp(34px,7vw,64px); font-weight:800; }
  .bg-win{ font-size:22px; text-align:center; background:#FBEBC8; }
  #bingo-ov{ position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,.68); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .bg-ov-box{ text-align:center; color:#fff; padding:20px; }

  .bg-ov-n{ margin-top:18px; } .bg-ov-n .bg-chip{ font-size:clamp(22px,5vw,48px); padding:6px 26px; }

  .mine-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; } .mine-grid b{ font-size:18px; }
  .mine-row{ padding:6px 0; border-bottom:1px solid var(--line); } .mine-row.over{ color:#B23B32; }
  .sw-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }

<script>
/* 老師的 Firebase 安全登入（Email/密碼）。老師輸入的還是原本的帳號密碼，程式在背後幫忙：
   ① 先用 Firebase 帳號登入；② 第一次（還沒有 Firebase 帳號）就用舊的密碼雜湊驗證，通過後建立 Firebase 帳號並「認領」這個老師帳號。
   資料庫規則 v2 啟用後，只有認領過的 Firebase 身分才能讀寫老師資料。三個頁面共用同一份邏輯（複製貼上），登入一次三邊都通。 */
window.mmTA = (function(){
  var DOM = "@teacher.mandamy.app";
  function A(){ return window.mmAuthApi; }
  function dbRef(p){ return window.ref(window.db, p); }
  async function rd(p){ var s = await window.get(dbRef(p)); return s.exists() ? s.val() : null; }
  function emailOf(id, gen){ return id + (gen ? ".g" + gen : "") + DOM; }
  function pwUser(){ var u = window.auth && window.auth.currentUser; if(!u || u.isAnonymous) return null; var pd = u.providerData || []; for(var i = 0; i < pd.length; i++) if(pd[i].providerId === "password") return u; return null; }
  // 目前登入的 Firebase 老師身分對應哪個老師帳號（沒有就回 null）
  async function who(){ var u = pwUser(); if(!u) return null; try{ return await rd("uidMap/" + u.uid); }catch(e){ return null; } }
  // 這個老師帳號是否已被認領（讀不到也當作已認領——規則 v2 只允許讀未認領的帳號）
  async function claimed(id){ try{ var a = await rd("teacherAccounts/" + id); return !!(a && a.uid); }catch(e){ return true; } }
  async function claim(id, u){
    var cur = null; try{ cur = await rd("teacherAccounts/" + id + "/uid"); }catch(e){}
    if(cur && cur !== u.uid) return false;
    if(!cur) await window.set(dbRef("teacherAccounts/" + id + "/uid"), u.uid);
    await window.set(dbRef("uidMap/" + u.uid), id);
    return true;
  }
  /* legacy(): 回傳 "ok"｜"none"（沒有這個帳號）｜"disabled"｜"wrong"，用舊雜湊驗證
     結果：{ ok:true, fb:true/false } 或 { ok:false, why:"none"|"disabled"|"wrong"|"conflict"|"weak" } */
  async function login(id, pw, legacy){
    var api = A();
    if(!api || !api.signInWithEmailAndPassword){ var l0 = await legacy(); return l0 === "ok" ? { ok: true, fb: false } : { ok: false, why: l0 }; }
    var gen = null; try{ gen = await rd("teacherAccounts/" + id + "/authGen"); }catch(e){}
    var email = emailOf(id, gen), cred = null, code = "";
    try{ cred = await api.signInWithEmailAndPassword(window.auth, email, pw); }catch(e){ code = (e && e.code) || ""; }
    if(cred && cred.user){
      var okc = await claim(id, cred.user).catch(function(){ return false; });
      if(!okc){ try{ await api.signOut(window.auth); await api.signInAnonymously(window.auth); }catch(e){} return { ok: false, why: "conflict" }; }
      return { ok: true, fb: true };
    }
    if(code === "auth/operation-not-allowed" || code === "auth/network-request-failed" || code === "auth/too-many-requests" || code === "auth/internal-error" || code === "auth/configuration-not-found"){
      var l1 = await legacy(); return l1 === "ok" ? { ok: true, fb: false } : { ok: false, why: l1 };
    }
    var l = await legacy();
    if(l !== "ok") return { ok: false, why: l };
    try{
      cred = await api.createUserWithEmailAndPassword(window.auth, email, pw);
    }catch(e){
      var c2 = (e && e.code) || "";
      if(c2 === "auth/email-already-in-use") return { ok: false, why: "conflict" };
      if(c2 === "auth/weak-password") return { ok: true, fb: false, weak: true };
      return { ok: true, fb: false };
    }
    var okc2 = await claim(id, cred.user).catch(function(){ return false; });
    if(!okc2){ try{ await api.signOut(window.auth); await api.signInAnonymously(window.auth); }catch(e){} return { ok: false, why: "conflict" }; }
    return { ok: true, fb: true };
  }
  async function logout(){
    var api = A(); if(!api) return;
    try{ if(pwUser()){ await api.signOut(window.auth); await api.signInAnonymously(window.auth); } }catch(e){}
  }
  // 自動登入判斷：已有 Firebase 老師身分且對得上 → "fb"；帳號還沒被認領（舊模式）→ "legacy"；否則 "login"
  async function resume(id){
    if(!id) return "login";
    var u = pwUser();
    if(u){ try{ if((await rd("teacherAccounts/" + id + "/uid")) === u.uid) return "fb"; }catch(e){} }
    if(!(await claimed(id))) return "legacy";
    return "login";
  }
  var WHY = { none: "找不到這個帳號", disabled: "這個帳號已被停用", wrong: "帳號或密碼錯誤", conflict: "這個帳號的安全登入密碼和目前密碼不一致，請聯絡管理員重設密碼。" };
  return { login: login, logout: logout, resume: resume, who: who, claimed: claimed, firebaseUser: pwUser, WHY: WHY, DOM: DOM };
})();

function trFindSlot(at){

// 新教材自動加入：content/packs.json 列出整理好的課（生詞／語法／課文），老師登入時自動補進自己的生詞庫。
// 每一包只加一次（記在 autoAdded），老師的教材庫裡已經有同一課就不動，老師之後刪掉也不會再自動加回來。
async function autoAddContentPacks(t, bank){
  if(!S.teacher || S.teacher.role === "ta") return bank;
  var list = null; try{ var r = await fetch("content/packs.json?v=" + MM_V, { cache: "no-store" }); if(r.ok) list = await r.json(); }catch(e){}
  if(!list || !Array.isArray(list.packs) || !list.packs.length) return bank;
  bank = bank || {}; var cd = Array.isArray(bank.courseData) ? bank.courseData.slice() : [], done = Object.assign({}, bank.autoAdded || {}), added = [], changed = false;
  for(var i = 0; i < list.packs.length; i++){
    var pk = list.packs[i]; if(!pk || !pk.id || done[pk.id]) continue;
    if(pk.type === "project"){   // 整理好的測驗／練習題：放進老師的測驗庫，並歸到對應課次
      try{
        var rp = await fetch(pk.file + "?v=" + MM_V, { cache: "no-store" }); if(!rp.ok) continue; var proj = await rp.json();
        var have = await fbGet("teacherLibraries/" + t + "/projects/" + proj.id);
        if(!have){
          var folders = (await fbGet("teacherLibraries/" + t + "/folders")) || {}, fk = Object.keys(folders);
          var fid = fk.filter(function(k){ return /學華語向前走/.test((folders[k] || {}).title || ""); })[0] || fk[0] || null;
          if(fid) proj.folderId = fid;
          await fbSet("teacherLibraries/" + t + "/projects/" + proj.id, proj);
          var lk = lkey(pk.book || DEFAULT_BOOK, pk.lesson); S.plat.lessonMap = S.plat.lessonMap || {}; S.plat.lessonMap[proj.id] = lk;
          await fbSet("teacherPlatform/" + t + "/lessonMap/" + proj.id, lk);
          added.push({ lesson: pk.lesson, title: proj.title, isProj: true });
        }
        done[pk.id] = Date.now(); changed = true;
      }catch(e){ console.warn("pack", pk.id, e); }
      continue;
    }
    var exists = cd.some(function(l){ return (l.book || DEFAULT_BOOK) === (pk.book || DEFAULT_BOOK) && Number(l.lesson) === Number(pk.lesson); });
    if(!exists){
      try{ var rr = await fetch(pk.file + "?v=" + MM_V, { cache: "no-store" }); if(!rr.ok) continue; var lesson = await rr.json(); if((pk.book || DEFAULT_BOOK) !== DEFAULT_BOOK) lesson.book = pk.book; cd.push(lesson); added.push(lesson); }catch(e){ continue; }
    }
    done[pk.id] = Date.now(); changed = true;
  }
  if(!changed) return bank;
  cd.sort(function(a, b){ return (Number(a.lesson) || 0) - (Number(b.lesson) || 0); });
  await fbUpdate("teacherVocabBanks/" + t, { courseData: cd, autoAdded: done, updatedAt: Date.now(), updatedBy: S.teacher.name || t });

  return Object.assign({}, bank, { courseData: cd, autoAdded: done });
}

async function syncTime(){
  var off = null;
  try{
    off = await new Promise(function(res){
      var done = false; var to = setTimeout(function(){ if(!done){ done = true; res(null); } }, 3000);
      try{ window.onValue(window.ref(window.db, ".info/serverTimeOffset"), function(snap){ if(done) return; done = true; clearTimeout(to); var v = snap.val(); res(typeof v === "number" ? v : null); }); }catch(e){ done = true; clearTimeout(to); res(null); }
    });
  }catch(e){}
  if(off == null){
    try{
      var t0 = Date.now(), r = await fetch(location.pathname + "?t=" + t0, { method: "HEAD", cache: "no-store" }), dh = r.headers.get("date");
      if(dh){ off = new Date(dh).getTime() - (t0 + (Date.now() - t0) / 2); }
    }catch(e){}

  return TIME_OK;

async function studentAuth(idx, name, pw){
  // 回傳 true＝通過；字串＝要顯示給學生的錯誤訊息
  var tid = idx.t, cid = idx.c, path = accPath(tid, cid, name);
  var acct = await fbGet(path);
  if(!acct) return "找不到「" + name + "」的帳號。請確認名字跟老師給的一樣，或請老師建立帳號。";
  await syncTime(); var now = nowMs();
  if(acct.lockUntil && acct.lockUntil > now) return "密碼輸入錯太多次了，請 " + Math.ceil((acct.lockUntil - now) / 60000) + " 分鐘後再試，或請老師幫你解鎖。";
  var sessKey = "mm_stu_" + cid + "_" + hwSkey(name), sess = null; try{ sess = localStorage.getItem(sessKey); }catch(e){}
  if(!pw){ if(sess && sess === acct.hashHex && !acct.mustChange) return true; return "這個班需要密碼，請輸入你的密碼。"; }
  var ok = (await pbkdf2(pw, acct.saltHex)) === acct.hashHex;
  if(!ok){
    var fails = (acct.fails || 0) + 1, patch = { fails: fails };
    if(fails >= 5){ patch.lockUntil = now + 10 * 60000; patch.fails = 0; }
    try{ await fbUpdate(path, patch); }catch(e){}
    return fails >= 5 ? "密碼錯太多次，已暫時鎖定 10 分鐘。" : "密碼不對（再錯 " + (5 - fails) + " 次會暫時鎖定）。";
  }
  var cur = acct;
  if(acct.mustChange){
    var np = null;
    for(var tries = 0; tries < 5; tries++){
      var a1 = await askText("第一次登入，請設定你自己的新密碼（至少 6 個字）", "", "下一步", "password"); if(!a1) return "需要先設定新密碼才能進入。";
      if(a1.length < 6){ alert("密碼至少要 6 個字。"); continue; }
      if(a1 === pw){ alert("新密碼不能跟初始密碼一樣。"); continue; }
      var a2 = await askText("再輸入一次新密碼", "", "確定", "password"); if(!a2) return "需要先設定新密碼才能進入。";
      if(a1 !== a2){ alert("兩次輸入不一樣，請再試一次。"); continue; }
      np = a1; break;
    }
    if(!np) return "新密碼沒有設定成功，請重試。";
    cur = await accSetPassword(tid, cid, name, np, false, { createdAt: acct.createdAt });
  } else if(acct.fails){ try{ await fbUpdate(path, { fails: 0 }); }catch(e){} }
  try{ await fbUpdate(path, { lastLogin: now }); localStorage.setItem(sessKey, cur.hashHex); }catch(e){}
  return true;
}

function reviewWords(label){
  var today = new Date(ymd(new Date()) + "T00:00:00").getTime(), buckets = { a: [], b: [], c: [] }, seen = {};
  recsOf(label).slice().reverse().forEach(function(r){
    if(!r.date || r.isAbsence) return;
    var age = Math.round((today - new Date(r.date + "T00:00:00").getTime()) / 86400000);
    if(age < 0 || age > 30) return;
    (r.vocab || []).forEach(function(v){
      if(!v.word || seen[v.word]) return; seen[v.word] = 1;
      (age <= 3 ? buckets.a : age <= 10 ? buckets.b : buckets.c).push({ word: v.word, sub: v.sub || "", date: r.date });
    });
  });
  return buckets;
}

function parseBatchHw(text){

  text.split("\n").forEach(function(line){
    line = line.trim(); if(!line) return;
    var m = /^(?:(\d{4})[-\/])?(\d{1,2})[-\/](\d{1,2})\s*(?:(\d{1,2}):(\d{2}))?\s+(.+)$/.exec(line); if(!m) return;
    var rest = m[6].split("|"), title = rest[0].trim(), body = (rest[1] || "").trim(); if(!title) return;
    out.push({ title: title, body: body, due: (m[1] || yy) + "-" + pad2(Number(m[2])) + "-" + pad2(Number(m[3])) + "T" + (m[4] ? pad2(Number(m[4])) + ":" + m[5] : "23:59") });

  var label = classInfo({ s: link.s, t: link.tm, c: link.c }), recs = Object.keys(recMap()).map(function(k){ return recMap()[k]; }).filter(function(r){ return recBelongsTo(r, { s: link.s, t: link.tm, c: link.c }); }).sort(function(a, b){ return (b.date || "").localeCompare(a.date || ""); }), out = [];
  recs.forEach(function(r){
    if(r.isAbsence) return;
    var mine = (r.students || []).filter(function(s){ return (s.name || "").trim() === link.name; })[0];
    if(!mine) return;
    var e = { date: r.date, material: r.material || "", absent: !!mine.absent };
    if(!mine.absent && link.showScores && hasScore(mine)){ e.total = stTotal(mine); e.scores = {}; RUBRIC.forEach(function(rb){ if(typeof mine[rb.key] === "number") e.scores[rb.label] = mine[rb.key] + "/" + rb.max; }); }
    out.push(e);
  });
  return out.slice(0, 40);
}

async function parentAct(a, roster, links, b){
  var tid = S.teacher.id, cid = S.sel.c, base = "teacherPlatform/" + tid + "/parentLinks";
  function tok(){ var x = new Uint8Array(15); crypto.getRandomValues(x); return Array.prototype.map.call(x, function(v){ return ACC_ALPHA[v % ACC_ALPHA.length]; }).join(""); }
  async function make(n){ var t = tok(); var L = { name: n, cid: cid, c: S.sel.c, s: S.sel.s, tm: S.sel.t, tid: tid, showScores: false, createdAt: nowMs() }; await fbSet(base + "/" + t, L); await refreshParentLink(t); return t; }
  if(a === "plink-copy"){ try{ await navigator.clipboard.writeText(parentUrl(b.dataset.tok)); toast("已複製家長連結"); }catch(e){ alert(parentUrl(b.dataset.tok)); } return; }
  if(a === "plink-new"){
    var n = b.dataset.n, old = Object.keys(links).filter(function(t){ return links[t].name === n; });
    if(old.length && !confirm("換新連結？舊的連結會立刻失效。")) return;
    for(var i = 0; i < old.length; i++){ await fbSet(base + "/" + old[i], null); await fbSet("teacherPlatform/" + tid + "/parentRecords/" + old[i], null); }
    await make(n); render(); return;
  }
  if(a === "plink-del"){ if(!confirm("停用這個家長連結？")) return; await fbSet(base + "/" + b.dataset.tok, null); await fbSet("teacherPlatform/" + tid + "/parentRecords/" + b.dataset.tok, null); render(); return; }

}
// 小折線圖：points = [{ v: 分數, t: 標籤 }]
function sparkSvg(pts){
  var W = 560, H = 140, L = 30, R = 10, T = 14, B = 26, n = pts.length, xs = function(i){ return L + (W - L - R) * (n === 1 ? .5 : i / (n - 1)); }, ys = function(v){ return T + (H - T - B) * (1 - Math.max(0, Math.min(100, v)) / 100); };
  var path = pts.map(function(p, i){ return (i ? "L" : "M") + xs(i).toFixed(1) + " " + ys(p.v).toFixed(1); }).join(" ");
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:560px;height:auto;"><line x1="' + L + '" y1="' + ys(60) + '" x2="' + (W - R) + '" y2="' + ys(60) + '" stroke="#D9CFC4" stroke-dasharray="4 4"/><text x="2" y="' + (ys(60) + 4) + '" font-size="11" fill="#8A7F73">60</text><path d="' + path + '" fill="none" stroke="#C0623A" stroke-width="2.5"/>' +
    pts.map(function(p, i){ return '<circle cx="' + xs(i).toFixed(1) + '" cy="' + ys(p.v).toFixed(1) + '" r="4" fill="#C0623A"/><text x="' + xs(i).toFixed(1) + '" y="' + (ys(p.v) - 8).toFixed(1) + '" font-size="12" text-anchor="middle" fill="#3B3228">' + p.v + '</text><text x="' + xs(i).toFixed(1) + '" y="' + (H - 8) + '" font-size="11" text-anchor="middle" fill="#8A7F73">' + esc(p.t) + '</text>'; }).join("") + '</svg>';
}

function shrinkImageBlob(file){
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onload = function(){ var im = new Image(); im.onload = function(){ var sc = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); c.toBlob(function(b){ b ? resolve(b) : reject(new Error("img")); }, "image/jpeg", 0.82); }; im.onerror = reject; im.src = fr.result; };
    fr.onerror = reject; fr.readAsDataURL(file);
  });
}
async function uploadFile(path, file, onProg){
  if(!window.storageApi) throw new Error("檔案儲存還沒準備好，請稍後再試");
  var blob = file;
  if(/^image\//.test(file.type) && file.size > 1500000){ try{ blob = await shrinkImageBlob(file); }catch(e){ blob = file; } }
  if(blob.size > HW_MAXFILE) throw new Error("「" + file.name + "」超過 30 MB");
  var A = window.storageApi, sr = A.ref(A.storage, path), task = A.uploadBytesResumable(sr, blob, { contentType: blob.type || file.type || "application/octet-stream" });
  await new Promise(function(res, rej){ task.on("state_changed", function(s){ if(onProg) onProg(s.bytesTransferred / s.totalBytes); }, rej, res); });
  return { name: file.name, size: blob.size, type: blob.type || file.type || "", url: await A.getDownloadURL(sr), path: path };
}

async function fillClassStudents(cls){

async function newLessonFlow(bid){
  var ns = await askText("第幾課？（數字，例如 7）", ""); if(!ns) return null;
  var no = cnNum(ns.replace(/[第課\s]/g, "")); if(!no || no < 1 || no > 999){ toast("請輸入課次數字"); return null; }
  var key = lkey(bid, no);
  if((S.plat.lessons || {})[key]){ toast("這本教材已經有第 " + no + " 課了"); return key; }
  var title = await askText("這一課的名稱（可以留空，之後再補）", "") || "";
  S.plat.customLessons = S.plat.customLessons || {};
  S.plat.customLessons[key] = { book: bid, no: no, title: title };
  try{ await fbSet("teacherPlatform/" + S.teacher.id + "/customLessons/" + key, S.plat.customLessons[key]); }catch(e){ toast("儲存失敗，請檢查網路或 Firebase 規則"); return null; }
  await syncLessonIndex();
  return key;
}
async function deleteBook(bid){
  if(bid === DEFAULT_BOOK) return;
  var ks = lessonsOfBook(bid);
  if(!confirm("刪除教材「" + bookTitle(bid) + "」？\n這本教材底下的課次會從平台消失，歸在裡面的簡報和測驗會變成「還沒歸課」（簡報與測驗本身不會被刪除）。")) return;
  var base = "teacherPlatform/" + S.teacher.id;
  delete S.plat.books[bid]; await fbSet(base + "/books/" + bid, null);
  var cl = S.plat.customLessons || {};
  for(var k in cl){ if(cl[k].book === bid){ delete cl[k]; try{ await fbSet(base + "/customLessons/" + k, null); }catch(e){} } }
  var lm = S.plat.lessonMap || {};
  for(var pid in lm){ var pk = parseKey(lm[pid]); if(pk && pk.book === bid){ delete lm[pid]; try{ await fbSet(base + "/lessonMap/" + pid, null); }catch(e){} } }
  // 各班：教材勾選與這些課次的開放設定一併清掉
  try{
    var schools = S.plat.schools || {};
    for(var sid in schools){ var terms = schools[sid].terms || {}; for(var tid in terms){ var cls = terms[tid].classes || {}; for(var cid in cls){
      var cp = base + "/schools/" + sid + "/terms/" + tid + "/classes/" + cid;

      ks.forEach(function(k){ if(cls[cid].lessonOpen && cls[cid].lessonOpen[k]){ delete cls[cid].lessonOpen[k]; fbSet(cp + "/lessonOpen/" + k, null); } });
    } } }
  }catch(e){}
  await syncLessonIndex(); render();
}

async function bingoStart(){

function bgPlayPatch(d){

function i18nWalk(rootEl){

function i18nStart(on){

// ---------- 斷線提示：網路不通時，頂端出現提醒，避免學生以為答案已經存到雲端 ----------
function startNetWatch(){
  if(document.getElementById("netbar")) return;
  var bar = document.createElement("div"); bar.id = "netbar"; bar.style.cssText = "display:none;position:fixed;top:0;left:0;right:0;z-index:99998;background:#B23B32;color:#fff;text-align:center;padding:8px 12px;font-size:14px;font-weight:700;";
  bar.textContent = "⚠️ 網路中斷了：現在輸入的內容還沒有存到雲端，連回網路後會自動同步。請先不要關掉這個頁面。"; document.body.appendChild(bar);
  var conn = true, online = navigator.onLine !== false;
  function upd(){ bar.style.display = (!online || !conn) ? "block" : "none"; }
  window.addEventListener("online", function(){ online = true; upd(); }); window.addEventListener("offline", function(){ online = false; upd(); });
  try{ window.onValue(window.ref(window.db, ".info/connected"), function(snap){ conn = snap.val() !== false; upd(); }); }catch(e){}
  upd();
}
