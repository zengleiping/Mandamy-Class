<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>測試新的 Firebase 專案｜曼米中文</title>
<style>body{font-family:system-ui,"PingFang TC",sans-serif;max-width:720px;margin:24px auto;padding:0 16px;line-height:1.7;color:#2A333C}textarea{width:100%;height:210px;font:13px/1.5 ui-monospace,monospace;padding:8px;border:1.5px solid #bbb;border-radius:10px}button{font:700 15px sans-serif;padding:8px 16px;border-radius:10px;border:0;background:#E8825A;color:#fff;cursor:pointer;margin:6px 6px 6px 0}button.g{background:#eee;color:#333}.note{color:#777;font-size:14px}#st{margin:10px 0;padding:8px 12px;border-radius:10px;background:#f4efe6}</style></head><body>
<h2>🧪 測試新的 Firebase 專案（只有這一台電腦）</h2>
<p class="note">搬家正式切換之前，先在這一台電腦上改連新專案試用；其他老師、學生完全不受影響。測完請按「還原」。</p>
<div id="st"></div>
<p>貼上新專案的 <b>firebaseConfig</b>（Firebase 專案設定 → 你的應用程式，整段貼上就可以，含大括號）：</p>
<textarea id="cfg" placeholder='{ apiKey: "...", authDomain: "...", databaseURL: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." }'></textarea>
<div><button id="on">只在這台電腦測試新專案</button><button id="off" class="g">還原（改回正式專案）</button><button id="go" class="g">開平台（app.html）</button></div>
<script>
var KEY = "mm_fb_override", st = document.getElementById("st");
function show(){ var o = null; try{ o = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){} st.textContent = o ? "目前這台電腦連到：" + o.projectId + "（測試中）" : "目前連到正式專案（沒有測試覆蓋）"; }
function parseCfg(t){
  var o = {}; ["apiKey","authDomain","databaseURL","projectId","storageBucket","messagingSenderId","appId","measurementId"].forEach(function(k){ var m = new RegExp(k + "\\s*:\\s*[\"']([^\"']+)[\"']").exec(t); if(m) o[k] = m[1]; });
  return o;
}
document.getElementById("on").onclick = function(){
  var c = parseCfg(document.getElementById("cfg").value);
  if(!c.apiKey || !c.projectId || !c.databaseURL){ alert("貼的內容裡找不到 apiKey、projectId、databaseURL。\n請確認是從 Firebase 複製的整段 firebaseConfig；如果 Realtime Database 還沒建立，databaseURL 不會出現。"); return; }
  localStorage.setItem(KEY, JSON.stringify(c)); show(); alert("好了。現在開平台（app.html）就是連到新專案；畫面上方會有紅色提示。");
};
document.getElementById("off").onclick = function(){ localStorage.removeItem(KEY); show(); alert("已還原，這台電腦改回正式專案。"); };
document.getElementById("go").onclick = function(){ location.href = "../app.html"; };
show();
</script></body></html>
