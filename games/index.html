<script type="module">
(async function(){
  try{
    var mods = await Promise.all([
      import("https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js"),
      import("https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js")
    ]);
    var fbApp = mods[0].initializeApp(window.FIREBASE_CONFIG);
    import("https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js").then(function(sm){
      window.storageApi = { storage: sm.getStorage(fbApp), ref: sm.ref, uploadBytes: sm.uploadBytes, getDownloadURL: sm.getDownloadURL };
    }).catch(function(e){ console.warn("檔案儲存載入失敗", e); });
    window.db = mods[1].getDatabase(fbApp);
    window.ref = mods[1].ref; window.get = mods[1].get; window.set = mods[1].set; window.update = mods[1].update; window.onValue = mods[1].onValue; window.onDisconnect = mods[1].onDisconnect;
    window.auth = mods[2].getAuth(fbApp);
    // 老師在平台已經登入的話沿用同一個身分；沒有就用匿名登入（學生只要輸入名字）
    var first = await new Promise(function(resolve){ var un = mods[2].onAuthStateChanged(window.auth, function(u){ try{ if(un) un(); }catch(e){} resolve(u); }); });
    if(!first){
      await new Promise(function(resolve, reject){
        mods[2].onAuthStateChanged(window.auth, function(u){ if(u) resolve(u); });
        mods[2].signInAnonymously(window.auth).catch(reject);
      });
    }
    window.__firebaseReady = true;
  }catch(e){ console.error("Firebase 連線失敗：", e); window.__firebaseFailed = true; }
  window.dispatchEvent(new Event("firebase-bridge-ready"));
})();
</script>
